        /* ==================== 附件上传/删除/下载 ==================== */
        function uploadImageAsJson(file) {
            return new Promise((resolve) => {
                if (!githubConfig.token || !githubConfig.repo) {
                    showToast('请先绑定 GitHub Token！', 'error');
                    resolve();
                    return;
                }
                const tipEl = document.getElementById('uploadStatusTip');
                if (tipEl) tipEl.textContent = '正在压缩图片并打包为独立 JSON 上传...';
                const sessionId = editSessionId;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 1200;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64DataUrl = canvas.toDataURL('image/webp', 0.7);
                        const payload = { data: base64DataUrl };
                        const contentEncoded = utf8ToBase64(JSON.stringify(payload));
                        const filename = `images/img_${Date.now()}_${Math.floor(Math.random() * 1000)}.json`;
                        const apiPath = encodeRepoPath(filename);
                        try {
                            const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                                method: 'PUT',
                                headers: { 'Authorization': `Bearer ${githubConfig.token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: `kb: upload image json ${filename}`, content: contentEncoded })
                            });
                            if (res.ok) {
                                if (sessionId !== editSessionId) {
                                    // 编辑已取消/已保存：这是迟到的上传结果，立即清理，避免留下孤儿文件
                                    await deleteGithubFileByPath(filename);
                                    if (tipEl) tipEl.textContent = 'Markdown 源码（支持粘贴截图）';
                                    resolve();
                                    return;
                                }
                                pendingUploads.push({ path: filename, name: filename, type: 'image' });
                                // 立即写入图片缓存，预览/查看时无需再等网络
                                imageJsonCache.set(filename, base64DataUrl);
                                insertImageMarkdown(document.getElementById('editContentInput'), filename);
                                if (isPreviewMode) setPreviewMode(true);
                                else if (tipEl) tipEl.textContent = 'Markdown 源码（图片已上传并插入）';
                                showToast('图片上传成功', 'success');
                            } else { showToast('图片上传失败', 'error'); }
                        } catch (err) { showToast('网络异常，图片上传失败', 'error'); }
                        resolve();
                    };
                    img.onerror = () => resolve();
                    img.src = event.target.result;
                };
                reader.onerror = () => resolve();
                reader.readAsDataURL(file);
            });
        }

        async function uploadGenericAttachment(file, currentIdx = 1, total = 1) {
            if (!githubConfig.token || !githubConfig.repo) { showToast('请先绑定 GitHub Token！', 'error'); return; }
            if (file.size > MAX_ATTACHMENT_SIZE) { showToast(`「${file.name}」超过 20MB，无法上传`, 'error'); return; }
            const type = getAttachmentType(file);
            const folder = ATTACHMENT_FOLDERS[type] || '其他';
            const safeName = sanitizeFileName(file.name);
            const stamp = Date.now();
            const sessionId = editSessionId;
            const fileLabel = total > 1 ? `「${file.name}」（${currentIdx}/${total}）` : `「${file.name}」`;
            const sizeLabel = formatSize(file.size);
            const message = `kb: upload attachment ${file.name}`;
            const isAuthFailure = (err) => /\((401|403|404)\)/.test(err.message || '') || /bad credentials/i.test(err.message || '');
            const cleanupPaths = async (paths) => { if (paths.length) await Promise.allSettled(paths.map(p => deleteGithubFileByPath(p))); };

            showLoading('正在读取文件...');
            try {
                let path = '';
                let parts = null;

                if (file.size > CHUNKED_UPLOAD_THRESHOLD) {
                    // 大文件分片上传：每片约 1.5MB，避免单次请求体过大被网络/网关中断
                    const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                    parts = [];
                    try {
                        for (let i = 0; i < totalChunks; i++) {
                            if (sessionId !== editSessionId) break;
                            const start = i * CHUNK_SIZE;
                            const end = Math.min(file.size, start + CHUNK_SIZE);
                            const chunk = file.slice(start, end);
                            updateLoadingText(`正在读取第 ${i + 1}/${totalChunks} 段...`);
                            const chunkBase64 = await fileToBase64(chunk, (frac) => {
                                setLoadingProgress(((i + frac) / totalChunks) * 10, `正在读取第 ${i + 1}/${totalChunks} 段…`);
                            });
                            const partPath = `attachments/${folder}/${stamp}_${safeName}.part${i + 1}`;
                            updateLoadingText(`正在上传第 ${i + 1}/${totalChunks} 段...`);
                            await uploadAttachmentViaContents(partPath, chunkBase64, `${message} (part ${i + 1})`, (frac) => {
                                setLoadingProgress(10 + ((i + frac) / totalChunks) * 80, `正在上传第 ${i + 1}/${totalChunks} 段…`);
                            });
                            parts.push({ path: partPath, size: end - start });
                            pendingUploads.push({ name: file.name, path: partPath, size: end - start, type });
                        }
                    } catch (chunkErr) {
                        // 分片中途失败：清掉已经传上去的部分，避免留下半截文件
                        const uploaded = parts.map(p => p.path);
                        pendingUploads = pendingUploads.filter(u => !uploaded.includes(u.path));
                        parts = [];
                        await cleanupPaths(uploaded);
                        throw chunkErr;
                    }

                    if (sessionId !== editSessionId || !parts.length) {
                        const uploaded = parts.map(p => p.path);
                        pendingUploads = pendingUploads.filter(u => !uploaded.includes(u.path));
                        await cleanupPaths(uploaded);
                        return;
                    }
                    path = parts[0].path;
                } else {
                    path = `attachments/${folder}/${stamp}_${safeName}`;
                    updateLoadingText('正在读取文件...');
                    setLoadingProgress(0, '准备读取文件...');
                    const base64 = await fileToBase64(file, (frac) => {
                        setLoadingProgress(frac * 10, `正在读取文件 ${sizeLabel}…`);
                    });

                    updateLoadingText('正在上传附件...');
                    setLoadingProgress(10, `正在上传文件 ${sizeLabel}…`);
                    const onUploadProgress = (frac) => setLoadingProgress(10 + frac * 80, `正在上传文件 ${sizeLabel}…`);

                    if (file.size <= CONTENTS_UPLOAD_LIMIT) {
                        // 10MB 以内默认走 Contents API 单请求；若不是权限问题，再用 Git Data API 补一次
                        try {
                            await uploadAttachmentViaContents(path, base64, message, onUploadProgress);
                        } catch (contentsErr) {
                            if (isAuthFailure(contentsErr)) throw contentsErr;
                            console.warn('Contents API 上传失败，改用 Git Data API 重试', contentsErr);
                            updateLoadingText('正在重试上传...');
                            setLoadingProgress(10, `正在重试上传 ${sizeLabel}…`);
                            try {
                                await uploadAttachmentViaGitData(path, base64, message,
                                    (frac) => setLoadingProgress(10 + frac * 80, `正在重试上传 ${sizeLabel}…`),
                                    () => {
                                        updateLoadingText('正在写入仓库...');
                                        setLoadingProgress(90, '正在写入仓库…');
                                    });
                            } catch (gitErr) {
                                throw new Error(`${contentsErr.message}；改用 Git Data API 重试仍失败：${gitErr.message}`);
                            }
                        }
                    } else {
                        try {
                            await uploadAttachmentViaGitData(path, base64, message, onUploadProgress, () => {
                                updateLoadingText('正在写入仓库...');
                                setLoadingProgress(90, '正在写入仓库…');
                            });
                        } catch (gitErr) {
                            if (isAuthFailure(gitErr)) throw gitErr;
                            // Git Data 的多步提交失败时，退回 Contents API 再试一次
                            console.warn('Git Data API 上传失败，改用 Contents API 重试', gitErr);
                            updateLoadingText('正在重试上传...');
                            setLoadingProgress(10, `正在重试上传 ${sizeLabel}…`);
                            try {
                                await uploadAttachmentViaContents(path, base64, message,
                                    (frac) => setLoadingProgress(10 + frac * 80, `正在重试上传 ${sizeLabel}…`));
                            } catch (contentsErr) {
                                throw new Error(`${gitErr.message}；改用 Contents API 重试仍失败：${contentsErr.message}`);
                            }
                        }
                    }

                    if (sessionId !== editSessionId) {
                        // 编辑已取消/已保存：这是迟到的上传结果，立即清理，避免留下孤儿文件
                        await deleteGithubFileByPath(path);
                        return;
                    }
                    pendingUploads.push({ name: file.name, path, size: file.size, type });
                }

                updateLoadingText('正在写入仓库...');
                setLoadingProgress(96, '即将完成…');
                const record = { name: file.name, path, size: file.size, type, uploadedAt: new Date().toLocaleString() };
                if (parts) record.parts = parts;
                editAttachments.push(record);
                renderEditAttachments();
                setLoadingProgress(100, '上传完成');
                showToast(`${fileLabel}上传成功`, 'success');
            } catch (e) {
                let msg = e.message || '未知错误';
                const authError = /\(401\)/i.test(msg) || /bad credentials/i.test(msg);
                if (authError) {
                    msg += '。访问令牌无效或已过期，请在仓库配置里重新填写 Token';
                } else if (/\(403\)/i.test(msg)) {
                    msg += '。请确认 Token 对仓库拥有 Contents 读写权限';
                } else if (file.size >= 5 * 1024 * 1024) {
                    msg += '。该文件较大，若反复失败可尝试压缩到更小或更换网络';
                }
                showToast(`${fileLabel}上传失败：${msg}`, 'error');
            }
            finally { hideLoading(); }
        }

        async function handleAttachmentUpload(files) {
            if (!files || !files.length) return;
            const imageFiles = [];
            const otherFiles = [];
            for (const file of files) {
                if (getAttachmentType(file) === 'image') imageFiles.push(file);
                else otherFiles.push(file);
            }
            for (const file of imageFiles) await uploadImageAsJson(file);
            for (let i = 0; i < otherFiles.length; i++) await uploadGenericAttachment(otherFiles[i], i + 1, otherFiles.length);
        }

        // 单文件附件返回 [path]；分片附件返回所有分片路径
        function getAttachmentPaths(att) {
            if (!att) return [];
            if (Array.isArray(att.parts) && att.parts.length) {
                return att.parts.map(p => p && p.path).filter(Boolean);
            }
            return att.path ? [att.path] : [];
        }

        async function deleteEditAttachment(index) {
            const att = editAttachments[index];
            if (!att) return;
            const attPaths = getAttachmentPaths(att);
            const isPendingUpload = attPaths.some(p => pendingUploads.some(u => u.path === p));
            const ok = await showConfirm({
                title: '删除附件',
                desc: isPendingUpload
                    ? `确定要删除附件「${att.name}」吗？该文件会立即从 GitHub 中清理。`
                    : `确定要从当前编辑中移除附件「${att.name}」吗？保存后才会从 GitHub 中清理，取消编辑则保留原文件。`,
                okText: '确定删除', cancelText: '取消', type: 'danger'
            });
            if (!ok) return;
            editAttachments.splice(index, 1);
            renderEditAttachments();
            if (isPendingUpload) {
                // 本次编辑刚上传的附件：立即删除，避免取消编辑后残留在仓库
                pendingUploads = pendingUploads.filter(u => !attPaths.includes(u.path));
                showLoading('正在删除附件...');
                try { await Promise.allSettled(attPaths.map(p => deleteGithubFileByPath(p))); } finally { hideLoading(); }
                showToast('附件已删除', 'success');
            } else {
                // 原有附件：先从编辑列表移除，保存时才真正删除；取消编辑不会破坏已有文件
                pendingDeletedAttachments.push(att);
                showToast('已移除，保存后生效', 'success');
            }
        }

        async function downloadAttachment(index) {
            const doc = docs.find(d => d.id === currentDocId);
            if (!doc || !doc.attachments || !doc.attachments[index]) return;
            const att = doc.attachments[index];
            await prepareAndDownload(att.name, async () => {
                const mime = guessMimeByName(att.name);
                const paths = getAttachmentPaths(att);
                if (!paths.length) throw new Error('附件不存在');

                const partSizes = (att.parts && att.parts.length)
                    ? att.parts.map(p => Number(p.size) || 0)
                    : [Number(att.size) || 0];
                const totalBytes = partSizes.reduce((sum, n) => sum + n, 0) || (Number(att.size) || 0);

                setLoadingProgress(0, paths.length > 1 ? `准备下载（共 ${paths.length} 段）…` : '准备下载…');
                const blobs = [];
                let doneBytes = 0;
                for (let i = 0; i < paths.length; i++) {
                    const partLabel = paths.length > 1 ? `正在下载 ${i + 1}/${paths.length} 段…` : '正在下载文件…';
                    updateLoadingText(partLabel);
                    const blob = await fetchGithubFileRawWithProgress(paths[i], (frac) => {
                        const loaded = doneBytes + frac * (partSizes[i] || 0);
                        const pct = totalBytes > 0
                            ? (loaded / totalBytes) * 100
                            : ((i + frac) / paths.length) * 100;
                        setLoadingProgress(pct, partLabel);
                    });
                    blobs.push(blob);
                    doneBytes += blob.size;
                }
                setLoadingProgress(100, '下载完成');
                return new Blob(blobs, { type: mime });
            });
        }

        async function deleteGithubFileByPath(path) {
            if (!githubConfig.token || !githubConfig.repo || !path) return false;
            try {
                const apiPath = encodeRepoPath(path);
                const getRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                    headers: { 'Authorization': `Bearer ${githubConfig.token}` }
                });
                if (!getRes.ok) return false;
                const fileData = await getRes.json();
                const delRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${githubConfig.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `kb: cleanup ${path}`, sha: fileData.sha })
                });
                return delRes.ok;
            } catch (e) { return false; }
        }

        async function deleteGithubAttachments(attachments) {
            if (!githubConfig.token || !githubConfig.repo || !attachments || !attachments.length) return;
            const paths = [];
            attachments.forEach(att => paths.push(...getAttachmentPaths(att)));
            await Promise.allSettled(paths.map(p => deleteGithubFileByPath(p)));
        }

        /* ==================== 编辑会话：未保存上传的追踪与清理 ==================== */
        function beginEditSession() {
            editSessionId += 1;
            pendingUploads = [];
            pendingDeletedAttachments = [];
            return editSessionId;
        }

        // 作废当前编辑会话，并清理其中已上传但尚未保存的文件
        async function discardEditSessionUploads(showTip = false) {
            const abandoned = pendingUploads.slice();
            abandoned.forEach(u => imageJsonCache.delete(u.path));
            beginEditSession();
            if (!abandoned.length) return;
            showLoading('正在清理未保存的上传文件...');
            try {
                await Promise.allSettled(abandoned.map(u => deleteGithubFileByPath(u.path)));
                if (showTip) showToast('已清理未保存的图片与附件', 'success');
            } finally { hideLoading(); }
        }

        /* ==================== 查看文档 ==================== */
        async function openDocView(id, options = {}) {
            const skipOverlay = !!options.skipOverlay;
            currentDocId = id;
            previousDocId = id;
            isEditing = false;
            localStorage.setItem(LAST_DOC_KEY, id);
            const doc = docs.find(d => d.id === id);
            if (!doc) {
                // 文档不存在时也要收起遮罩，避免界面卡在加载态
                if (!skipOverlay) hideLoading();
                return;
            }
            const viewScrollEl = document.getElementById('viewScrollContainer');
            if (viewScrollEl) viewScrollEl.scrollTop = 0;
            if (!skipOverlay) showLoading('正在加载文章...');

            let content = docContentCache.get(id);
            const tempDiv = document.createElement('div');
            try {
                if (content === undefined) {
                    try { content = await fetchDocContent(id); }
                    catch (e) { content = ''; showToast('正文加载失败：' + (e.message || '未知错误'), 'error'); }
                }
                await renderMarkdownInto(tempDiv, content);
            } catch (e) {
                console.warn('正文渲染失败', e);
                showToast('正文渲染失败', 'error');
            } finally {
                if (!skipOverlay) hideLoading();
            }

            const mainPanel = document.getElementById('mainPanel');
            mainPanel.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editPanel').classList.add('hidden');
            document.getElementById('viewPanel').classList.remove('hidden');

            document.getElementById('viewTitle').textContent = doc.title;
            document.getElementById('viewCategoryText').textContent = doc.category || '通用';
            const viewDateEl = document.getElementById('viewDate');
            viewDateEl.innerHTML = '<i class="ri-time-line mr-1"></i>';
            viewDateEl.appendChild(document.createTextNode(`修改于: ${doc.updatedAt || '未知'}`));

            document.getElementById('viewCodeText').textContent = doc.code || 'CM-0000';
            const codeBtn = document.getElementById('viewCodeBtn');
            const handleCodeCopy = (e) => {
                if (e) e.preventDefault();
                navigator.clipboard.writeText(doc.code || '').then(() => {
                    showToast(`已复制知识编码: ${doc.code}`, 'success');
                }).catch(() => { showToast(`已复制知识编码: ${doc.code}`, 'success'); });
                codeBtn.blur();
                codeBtn.classList.remove('active');
            };
            // 仅绑定 click：移动端浏览器会在 touchend 后补发 click，同时绑定会导致复制两次
            codeBtn.onclick = handleCodeCopy;

            // 直接搬移 DOM 节点，保留图片加载态、事件（含失败重试），也避免把巨型 dataURL 再解析一遍
            const viewContentEl = document.getElementById('viewContent');
            viewContentEl.replaceChildren(...Array.from(tempDiv.childNodes));

            const tagsContainer = document.getElementById('viewTags');
            tagsContainer.innerHTML = '';
            (doc.tags || []).forEach(t => {
                const tagEl = document.createElement('span');
                // 与时间、编码保持同一种纯文字样式，不加背景框
                tagEl.className = 'whitespace-nowrap text-[13px] text-slate-400';
                tagEl.textContent = `# ${t}`;
                tagsContainer.appendChild(tagEl);
            });

            renderViewAttachments();

            if (viewScrollEl) viewScrollEl.scrollTop = 0;
            renderDocList();
            checkBackToTopBtnVisibility();
        }

        // 同步完成后：刷新当前打开的文档，或恢复上次打开的文档（不打断编辑）
        async function maybeRestoreDocView() {
            if (isEditing) return;
            const targetId = currentDocId || localStorage.getItem(LAST_DOC_KEY);
            if (!targetId) return;

            if (!docs.some(d => d.id === targetId)) {
                localStorage.removeItem(LAST_DOC_KEY);
                if (currentDocId) {
                    currentDocId = null;
                    previousDocId = null;
                    document.getElementById('viewPanel').classList.add('hidden');
                    document.getElementById('editPanel').classList.add('hidden');
                    if (window.innerWidth < 768) document.getElementById('mainPanel').classList.add('hidden');
                    else document.getElementById('emptyState').classList.remove('hidden');
                    renderDocList();
                }
                return;
            }
            await openDocView(targetId);
        }

        function setupGlobalBackToTop() {
            const btn = document.getElementById('backToTopBtn');
            const viewScroll = document.getElementById('viewScrollContainer');
            const editScroll = document.getElementById('editScrollContainer');

            window.checkBackToTopBtnVisibility = function() {
                const mainPanel = document.getElementById('mainPanel');
                const viewPanel = document.getElementById('viewPanel');
                const editPanel = document.getElementById('editPanel');

                if (mainPanel.classList.contains('hidden')) {
                    btn.classList.add('hidden');
                    return;
                }

                const viewVisible = !viewPanel.classList.contains('hidden');
                const editVisible = !editPanel.classList.contains('hidden');
                if (!viewVisible && !editVisible) {
                    btn.classList.add('hidden');
                    return;
                }

                let currentScrollTop = 0;
                if (viewVisible) currentScrollTop = viewScroll.scrollTop;
                else if (editVisible) currentScrollTop = editScroll.scrollTop;

                if (currentScrollTop > 200) btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            };

            viewScroll.addEventListener('scroll', checkBackToTopBtnVisibility);
            editScroll.addEventListener('scroll', checkBackToTopBtnVisibility);

            btn.onclick = () => {
                if (!document.getElementById('viewPanel').classList.contains('hidden')) {
                    viewScroll.scrollTo({ top: 0, behavior: 'smooth' });
                } else if (!document.getElementById('editPanel').classList.contains('hidden')) {
                    editScroll.scrollTo({ top: 0, behavior: 'smooth' });
                }
                btn.blur();
            };
        }

        /* ==================== 图片查看器 ==================== */
        let currentModalImgSrc = '';
        // 当前文档内的图片集合，支持查看器内左右切换
        let galleryImages = [];
        let galleryIndex = 0;
        let currentScale = 1;
        let minScale = 1;
        let maxScale = 5;
        let imgTranslateX = 0;
        let imgTranslateY = 0;
        let isDraggingImg = false;
        let startDragX = 0, startDragY = 0;
        let initialPinchDistance = null;
        let initialPinchScale = 1;
        // 移动端左右滑动换图
        let swipeOffsetX = 0;
        let swipeIntent = null; // null | 'swipe' | 'pan'

        function setupImageViewerModal() {
            const modal = document.getElementById('imageModal');
            const closeBtn = document.getElementById('closeImageModalBtn');
            const downloadBtn = document.getElementById('downloadImageBtn');
            const container = document.getElementById('imageContainer');
            const imgView = document.getElementById('modalImageView');
            const closeModal = () => modal.classList.add('hidden');
            closeBtn.onclick = closeModal;
            document.getElementById('prevImageBtn').onclick = (e) => {
                e.stopPropagation();
                showGalleryImage(galleryIndex - 1);
            };
            document.getElementById('nextImageBtn').onclick = (e) => {
                e.stopPropagation();
                showGalleryImage(galleryIndex + 1);
            };
            document.addEventListener('keydown', (e) => {
                if (modal.classList.contains('hidden')) return;
                if (e.key === 'Escape') { closeModal(); return; }
                if (galleryImages.length > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                    e.preventDefault();
                    showGalleryImage(galleryIndex + (e.key === 'ArrowRight' ? 1 : -1));
                }
            });

            // ===== 单击/点按关闭：位移与时长阈值 =====
            const TAP_MOVE_THRESHOLD = 10;   // 位移超过 10px 视为拖拽
            const TAP_TIME_THRESHOLD = 600;  // 按住超过 600ms 不算单击
            let pointerDownX = 0, pointerDownY = 0, pointerDownTime = 0;
            let pointerMoved = false;
            let pinchActive = false;

            const beginPointer = (x, y) => {
                pointerDownX = x;
                pointerDownY = y;
                pointerDownTime = Date.now();
                pointerMoved = false;
            };
            const movedBeyondThreshold = (x, y) => {
                return Math.hypot(x - pointerDownX, y - pointerDownY) > TAP_MOVE_THRESHOLD;
            };
            const shouldCloseByTap = (x, y) => {
                if (modal.classList.contains('hidden')) return false;
                if (pointerMoved) return false;
                if (movedBeyondThreshold(x, y)) return false;
                if (Date.now() - pointerDownTime > TAP_TIME_THRESHOLD) return false;
                return true;
            };

            // ===== 桌面端：滚轮缩放 =====
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.15;
                let newScale = e.deltaY < 0 ? currentScale + zoomFactor : currentScale - zoomFactor;
                if (newScale < minScale) newScale = minScale;
                if (newScale > maxScale) newScale = maxScale;
                currentScale = newScale;
                clampTranslation();
                updateImageTransform();
            }, { passive: false });

            // ===== 桌面端：按下 / 拖拽 / 抬起 =====
            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDraggingImg = true;
                startDragX = e.clientX - imgTranslateX;
                startDragY = e.clientY - imgTranslateY;
                beginPointer(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDraggingImg) return;
                imgTranslateX = e.clientX - startDragX;
                imgTranslateY = e.clientY - startDragY;
                if (movedBeyondThreshold(e.clientX, e.clientY)) pointerMoved = true;
                clampTranslation();
                updateImageTransform();
            });
            window.addEventListener('mouseup', (e) => {
                if (!isDraggingImg) return;
                isDraggingImg = false;
                if (shouldCloseByTap(e.clientX, e.clientY)) closeModal();
            });

            // ===== 移动端：单指拖拽 / 双指缩放 =====
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDraggingImg = true;
                    swipeOffsetX = 0;
                    swipeIntent = null;
                    // 若上一次滑入动画尚未结束，先取消，避免手势冲突
                    if (imgView.getAnimations) imgView.getAnimations().forEach(a => a.cancel());
                    startDragX = e.touches[0].clientX - imgTranslateX;
                    startDragY = e.touches[0].clientY - imgTranslateY;
                    beginPointer(e.touches[0].clientX, e.touches[0].clientY);
                    pinchActive = false;
                } else if (e.touches.length === 2) {
                    isDraggingImg = false;
                    pointerMoved = true;
                    pinchActive = true;
                    swipeOffsetX = 0;
                    swipeIntent = null;
                    updateImageTransform();
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialPinchScale = currentScale;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (isDraggingImg && e.touches.length === 1) {
                    const t = e.touches[0];
                    const dx = t.clientX - pointerDownX;
                    const dy = t.clientY - pointerDownY;
                    if (!swipeIntent && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
                        const canSwipe = window.innerWidth < 768
                            && galleryImages.length > 1
                            && currentScale <= minScale * 1.01;
                        swipeIntent = (canSwipe && Math.abs(dx) > Math.abs(dy) * 1.15) ? 'swipe' : 'pan';
                    }
                    if (swipeIntent === 'swipe') {
                        // 未放大时横向拖动 = 换图，跟手移动
                        swipeOffsetX = dx;
                        pointerMoved = true;
                        updateImageTransform();
                        return;
                    }
                    imgTranslateX = t.clientX - startDragX;
                    imgTranslateY = t.clientY - startDragY;
                    if (movedBeyondThreshold(t.clientX, t.clientY)) pointerMoved = true;
                    clampTranslation();
                    updateImageTransform();
                } else if (e.touches.length === 2 && initialPinchDistance) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let newScale = initialPinchScale * (dist / initialPinchDistance);
                    if (newScale < minScale) newScale = minScale;
                    if (newScale > maxScale) newScale = maxScale;
                    currentScale = newScale;
                    clampTranslation();
                    updateImageTransform();
                }
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    const wasDragging = isDraggingImg;
                    isDraggingImg = false;
                    if (wasDragging && !pinchActive && e.changedTouches && e.changedTouches[0]) {
                        const t = e.changedTouches[0];
                        if (swipeIntent === 'swipe') {
                            const dx = swipeOffsetX;
                            const elapsed = Date.now() - pointerDownTime;
                            const shouldSwitch = Math.abs(dx) > 56 || (Math.abs(dx) > 30 && elapsed < 260);
                            if (shouldSwitch && galleryImages.length > 1) {
                                animateGallerySwipeOut(dx < 0 ? 1 : -1);
                            } else {
                                springBackGallerySwipe();
                            }
                        } else if (shouldCloseByTap(t.clientX, t.clientY)) {
                            closeModal();
                        }
                    }
                    swipeIntent = null;
                    pinchActive = false;
                }
                if (e.touches.length < 2) initialPinchDistance = null;
            });

            // ===== 下载图片 =====
            downloadBtn.onclick = () => {
                if (!currentModalImgSrc) { showToast('图片未加载', 'error'); return; }
                const src = currentModalImgSrc;
                let srcExt = 'jpg';
                if (src.startsWith('data:image/png')) srcExt = 'png';
                else if (src.startsWith('data:image/webp')) srcExt = 'webp';
                else if (src.startsWith('data:image/gif')) srcExt = 'gif';
                else if (src.startsWith('data:image/jpeg') || src.startsWith('data:image/jpg')) srcExt = 'jpg';
                else if (src.startsWith('data:image/')) {
                    const m = src.match(/^data:image\/([a-zA-Z0-9.+-]+)/);
                    if (m) { srcExt = m[1].toLowerCase(); if (srcExt === 'jpeg') srcExt = 'jpg'; }
                }
                const targetExt = srcExt === 'webp' ? 'png' : srcExt;
                const filename = `knowledge_image_${Date.now()}.${targetExt}`;

                prepareAndDownload(filename, async () => {
                    let sourceUrl = src;
                    if (!src.startsWith('data:')) {
                        const resp = await fetch(src);
                        if (!resp.ok) throw new Error('获取图片失败');
                        const blob = await resp.blob();
                        if (!blob || blob.size === 0) throw new Error('图片内容为空');
                        sourceUrl = await new Promise((res, rej) => {
                            const r = new FileReader();
                            r.onload = () => res(r.result);
                            r.onerror = () => rej(new Error('图片读取失败'));
                            r.readAsDataURL(blob);
                        });
                    }
                    if (srcExt === 'webp') return await convertDataUrlToBlobType(sourceUrl, 'image/png');
                    return dataURLtoBlob(sourceUrl);
                });
            };
        }
        function clampTranslation() {
            const imgView = document.getElementById('modalImageView');
            if (!imgView.naturalWidth) return;
            const containerW = window.innerWidth;
            const containerH = window.innerHeight;
            const renderedW = imgView.naturalWidth * currentScale;
            const renderedH = imgView.naturalHeight * currentScale;
            const maxTransX = Math.max(0, (renderedW - containerW) / 2 + 100);
            const maxTransY = Math.max(0, (renderedH - containerH) / 2 + 100);
            imgTranslateX = Math.min(Math.max(imgTranslateX, -maxTransX), maxTransX);
            imgTranslateY = Math.min(Math.max(imgTranslateY, -maxTransY), maxTransY);
        }
        // 从正文里的某张图打开查看器，并把同文档的全部图片一起带上
        function openGalleryFromImage(imgEl) {
            const scope = imgEl.closest('.markdown-body') || document.getElementById('viewContent') || document.getElementById('editPreview');
            let imgs = scope ? Array.from(scope.querySelectorAll('img')) : [imgEl];
            imgs = imgs.filter(el => {
                const src = el.getAttribute('src');
                return src && !el.closest('.md-img-frame.is-error');
            });
            const srcs = imgs.map(el => el.getAttribute('src'));
            let index = imgs.indexOf(imgEl);
            if (index < 0) index = Math.max(0, srcs.indexOf(imgEl.getAttribute('src')));
            openImageViewerModal(imgEl.getAttribute('src'), srcs, index);
        }

        function openImageViewerModal(src, images, index) {
            galleryImages = (Array.isArray(images) && images.length) ? images.slice() : [src];
            let idx = Number.isInteger(index) ? index : galleryImages.indexOf(src);
            if (idx < 0 || idx >= galleryImages.length) idx = 0;
            renderGalleryThumbs();
            showGalleryImage(idx);
        }

        // 移动端滑动切图：旧图滑出
        function animateGallerySwipeOut(dir) {
            const imgView = document.getElementById('modalImageView');
            const startX = swipeOffsetX;
            const exitX = (dir > 0 ? -1 : 1) * window.innerWidth * 0.55;
            if (imgView.animate) {
                imgView.animate([
                    { transform: `translate3d(${startX}px, ${imgTranslateY}px, 0px) scale(${currentScale})`, opacity: 1 },
                    { transform: `translate3d(${exitX}px, ${imgTranslateY}px, 0px) scale(${currentScale})`, opacity: 0.15 }
                ], { duration: 160, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' });

        // 移动端滑动未达阈值：回弹
        function springBackGallerySwipe() {

            updateImageTransform();
            if (imgView.animate) {
                imgView.animate([

                    { transform: `translate3d(0px, ${imgTranslateY}px, 0px) scale(${currentScale})` }
                ], { duration: 200, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
            }

        function showGalleryImage(index, slideFrom = 0) {
            if (!galleryImages.length) return;
            galleryIndex = (index + galleryImages.length) % galleryImages.length;
            const src = galleryImages[galleryIndex];
            currentModalImgSrc = src;

            const modal = document.getElementById('imageModal');
            const imgView = document.getElementById('modalImageView');
            const slideSwitch = !!slideFrom;
            if (imgView.getAnimations) imgView.getAnimations().forEach(a => a.cancel());
            if (slideSwitch) {
                // 滑动切图：旧图立即隐藏，避免回弹闪烁，新图由滑入动画接管
                imgView.style.transition = 'none';
                imgView.style.opacity = '0';
                imgView.classList.remove('opacity-0');
            } else {
                imgView.classList.add('opacity-0');
            }
            imgTranslateX = 0;
            imgTranslateY = 0;
            swipeOffsetX = 0;
            swipeIntent = null;
            isDraggingImg = false;

            const fit = () => {
                // 多图时给底部缩略图留出空间，避免大图被遮住
                const galleryMode = galleryImages.length > 1;
                const containerW = window.innerWidth * (galleryMode ? 0.82 : 0.85);
                const containerH = window.innerHeight * (galleryMode ? 0.72 : 0.85);
                const natW = imgView.naturalWidth || 800;
                const natH = imgView.naturalHeight || 600;
                minScale = Math.min(containerW / natW, containerH / natH, 1.0);
                currentScale = minScale;
                maxScale = Math.max(minScale * 5, 5.0);
                imgView.style.width = natW + 'px';
                imgView.style.height = natH + 'px';
                updateImageTransform();
                if (slideSwitch) {
                    imgView.style.transition = '';
                    imgView.style.opacity = '';
                } else {
                    imgView.classList.remove('opacity-0');
                }
                if (slideFrom && imgView.animate) {
                    // 新图从手势方向滑入，和滑动动作衔接
                    const offset = slideFrom * Math.min(window.innerWidth * 0.42, 320);
                    imgView.animate([
                        { transform: `translate3d(${offset}px, 0px, 0px) scale(${currentScale})`, opacity: 0.35 },
                        { transform: `translate3d(0px, 0px, 0px) scale(${currentScale})`, opacity: 1 }
                    ], { duration: 260, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
                }
            };
            imgView.onload = fit;
            imgView.onerror = () => {
                if (slideSwitch) { imgView.style.transition = ''; imgView.style.opacity = ''; }
                imgView.classList.remove('opacity-0');
            };
            imgView.src = src;
            if (imgView.complete && imgView.naturalWidth > 0) fit();

            modal.classList.remove('hidden');

            const counter = document.getElementById('galleryCounter');
            if (counter) counter.textContent = `${galleryIndex + 1} / ${galleryImages.length}`;
            updateGalleryThumbsActive();
        }

        // 统计除指定文档外，其他文档仍在引用的图片/附件路径，删除时跳过，避免误删共享文件
        async function collectReferencedPathsExcluding(excludeDocId) {
            const used = new Set();
            for (const d of docs) {
                if (!d || d.id === excludeDocId) continue;
                (d.attachments || []).forEach(a => {
                    if (!a) return;
                    if (a.path) used.add(a.path);
                    (a.parts || []).forEach(p => { if (p && p.path) used.add(p.path); });
                });
                let c = docContentCache.get(d.id);
                if (c === undefined) {
                    try { c = await fetchDocContent(d.id); } catch (e) { c = ''; }
                }
                (String(c).match(/images\/img_\d+(?:_\d+)?\.json/g) || []).forEach(p => used.add(p));
            }
            return used;
        }

        async function deleteGithubImageJsonsInContent(content, protectedPaths = null) {
            if (!githubConfig.token || !githubConfig.repo || !content) return;
            const regex = /images\/img_\d+(?:_\d+)?\.json/g;
            const matches = content.match(regex);
            if (!matches) return;
            const uniquePaths = [...new Set(matches)].filter(p => !(protectedPaths && protectedPaths.has(p)));
            uniquePaths.forEach(p => imageJsonCache.delete(p));
            await Promise.allSettled(uniquePaths.map(jsonPath => deleteGithubFileByPath(jsonPath)));
        }

        // 插入图片 Markdown：只在前后确实需要时补一个换行，
        // 空编辑区或行首/行尾已有换行时不额外加，避免出现上下各一条空白行
        function insertImageMarkdown(textarea, filename) {
            if (!textarea) return;
            const value = textarea.value;
            const start = textarea.selectionStart ?? value.length;
            const end = textarea.selectionEnd ?? value.length;
            const before = value.slice(0, start);
            const after = value.slice(end);
            const snippet = `![图片](${filename})`;
            const prefix = before.length && !before.endsWith('\n') ? '\n' : '';
            const suffix = after.length && !after.startsWith('\n') ? '\n' : '';
            const inserted = prefix + snippet + suffix;
            textarea.value = before + inserted + after;
            const caret = start + inserted.length;
            textarea.selectionStart = textarea.selectionEnd = caret;
        }

        // 去掉粘贴时常见的空白、零宽字符、引号，以及误带上的 "Bearer "/"token " 前缀
        function normalizeToken(raw) {
            let s = String(raw || '').trim();
            s = s.replace(/^['"“”]+|['"“”]+$/g, '');
            s = s.replace(/^(?:Bearer|token)\s+/i, '');
            s = s.replace(/[\s​-‍﻿]/g, '');
            return s;
        }

        function loadGithubConfig() {
            const saved = localStorage.getItem('kb_gh_config');
            if (saved) {
                try { githubConfig = JSON.parse(saved); }
                catch (e) { githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' }; }
                githubConfig.token = normalizeToken(githubConfig.token);
                if (!githubConfig.repo) githubConfig.repo = 'XiandeShen/Xiande-kb';
                if (!githubConfig.path) githubConfig.path = 'kb_docs.json';
            }
        }

        // 用输入框里的 Token 实测「有效性 + 仓库写权限」，避免保存后才发现失败
        async function verifyGithubToken() {
            const statusEl = document.getElementById('verifyTokenStatus');
            const token = normalizeToken(document.getElementById('ghTokenInput').value);
            const repo = document.getElementById('ghRepoInput').value.trim() || githubConfig.repo;
            const showStatus = (text, ok) => {
                statusEl.textContent = text;
                statusEl.className = `mt-1.5 text-[12px] leading-relaxed ${ok ? 'text-emerald-600' : 'text-red-500'}`;
            };
            if (!token) { showStatus('请先填写 Token。', false); return; }
            if (!repo || !/^[^\/]+\/[^\/]+$/.test(repo)) { showStatus('仓库路径格式应为 Owner/Repo。', false); return; }
            showStatus('正在验证 Token…', true);
            try {
                const userRes = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
                });
                if (userRes.status === 401) {
                    showStatus('Token 无效或已过期（401 Bad credentials），请重新生成。', false);
                    return;
                }
                if (!userRes.ok) {
                    showStatus(await githubErrorText(userRes, 'Token 验证失败'), false);
                    return;
                }
                const user = await userRes.json();

                const repoRes = await fetch(`https://api.github.com/repos/${repo}`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
                });
                if (repoRes.status === 404) {
                    showStatus(`Token 有效（${user.login}），但无法访问仓库 ${repo}；请检查仓库名，或把该仓库加入 Token 的 Repository access。`, false);
                    return;
                }
                if (!repoRes.ok) {
                    showStatus(await githubErrorText(repoRes, '读取仓库失败'), false);
                    return;
                }
                const repoData = await repoRes.json();
                const canWrite = !!(repoData.permissions && repoData.permissions.push);
                if (canWrite) {
                    showStatus(`验证通过：Token 属于 ${user.login}，对 ${repoData.full_name} 有写权限，可以上传。`, true);
                } else {
                    showStatus(`Token 有效（${user.login}），但对 ${repoData.full_name} 没有写权限；请把 Contents 设为 Read and write 后重新生成 Token。`, false);
                }
            } catch (e) {
                showStatus('验证失败：' + (e.message || '网络异常'), false);
            }
        }

        function updateSyncStatus(type, msg) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            const refreshIcon = document.getElementById('syncRefreshIcon');
            if (!dot || !text) return;
            if (type === 'success') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0';
                text.textContent = msg || '已同步';
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            } else if (type === 'loading') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse flex-shrink-0';
                text.textContent = msg || '同步中';
                if (refreshIcon) refreshIcon.classList.add('animate-spin');
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
                text.textContent = msg || '同步失败';
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        function manualSyncRefresh() {
            if (isManualSyncing) return;
            if (!githubConfig.token || !githubConfig.repo) { showToast('请先配置访问令牌', 'error'); return; }
            isManualSyncing = true;
            pullFromGithub().finally(() => { isManualSyncing = false; });
        }

        async function handleResetBinding() {
            const ok = await showConfirm({
                title: '解除绑定并重置',
                desc: '确定要解除 GitHub 绑定并重置吗？本地的知识缓存也会被清空，需要重新输入访问令牌。',
                okText: '确定重置', cancelText: '再想想', type: 'normal'
            });
            if (!ok) return;
            localStorage.removeItem('kb_gh_config');
            await idbDel('kb_docs_index');
            docs = [];
            clearAllCaches();
            currentDocId = null;
            previousDocId = null;
            localStorage.removeItem(LAST_DOC_KEY);
            beginEditSession();
            editAttachments = [];
            searchQuery = '';
            repoDefaultBranch = '';
            githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' };
            document.getElementById('authTokInput').value = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('githubDropdown').classList.add('hidden');
            hideLoading();
            hideApp();
            fillAdvancedOptions();
            showAuth();
            renderCategoryList();
            renderTagList();
            renderDocList();
        }

        window.onload = async function() {
            loadGithubConfig();
            setupConfirmModal();
            setupAdvancedToggle();
            setupEventListeners();
            setupImageHandling();
            setupImageViewerModal();
            setupGlobalBackToTop();
            initVirtualList();
            updateSearchPlaceholder();
            window.addEventListener('resize', updateSearchPlaceholder);

            if (!githubConfig.token) {
                hideApp();
                document.getElementById('loadingOverlay').classList.add('hidden');
                fillAdvancedOptions();
                showAuth();
                return;
            }

            hideAuth();
            setLoadingMode('auth');
            document.getElementById('loadingOverlay').classList.remove('hidden');
            updateLoadingText(DEFAULT_LOADING_TEXT);

            await loadLocalDocs();
            renderCategoryList();
            renderTagList();
            renderDocList();

            pullFromGithub();
        };

        document.getElementById('toggleTokenVisibility').addEventListener('click', () => {
            const input = document.getElementById('authTokInput');
            const icon = document.getElementById('toggleTokenIcon');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'ri-eye-off-line text-base'; }
            else { input.type = 'password'; icon.className = 'ri-eye-line text-base'; }
        });

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (isLoggingIn) return;
            const token = normalizeToken(document.getElementById('authTokInput').value);
            if (!token) { showToast('请输入访问令牌', 'error'); return; }
            const repoInput = document.getElementById('authRepoInput').value.trim();
            const pathInput = document.getElementById('authPathInput').value.trim();
            githubConfig.token = token;
            githubConfig.repo = repoInput || githubConfig.repo || 'XiandeShen/Xiande-kb';
            githubConfig.path = pathInput || githubConfig.path || 'kb_docs.json';
            githubConfig.sha = '';
            repoDefaultBranch = '';
            localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
            isLoggingIn = true;
            setLoginButtonLoading(true);
            pullFromGithub();
        });

        async function pullFromGithub() {
            if (!githubConfig.token || !githubConfig.repo) {
                if (isLoggingIn) { isLoggingIn = false; setLoginButtonLoading(false); }
                else { hideLoading(); hideApp(); fillAdvancedOptions(); showAuth(); }
                return;
            }
            updateSyncStatus('loading', '同步中');

            try {
                let sha, text;
                try {
                    const result = await fetchGithubJSONWithMeta(githubConfig.path);
                    sha = result.sha;
                    text = result.text;
                } catch (metaErr) {
                    if (metaErr.status === 404) {
                        setLoadingMode('auth');
                        showLoading('正在初始化知识库...');
                        docs = [];
                        clearAllCaches();
                        try {
                            await uploadMainIndex([]);
                        } catch (initErr) {
                            // 空索引初始化失败（常见于 Token 无写权限），给出明确提示并退回登录页
                            console.warn('初始化空索引失败', initErr);
                            updateSyncStatus('error', '初始化失败');
                            showToast('空索引初始化失败：请确认 Token 拥有该仓库的写入权限', 'error');
                            hideLoading();
                            if (isLoggingIn) { isLoggingIn = false; setLoginButtonLoading(false); }
                            hideApp();
                            fillAdvancedOptions();
                            showAuth();
                            return;
                        }
                        hideLoading();
                        hideAuth();
                        showApp();
                        saveLocalDocs();
                        if (isLoggingIn) { isLoggingIn = false; setLoginButtonLoading(false); }
                        return;
                    }
                    throw metaErr;
                }

                githubConfig.sha = sha;
                // 重新同步后本地缓存可能已过期，清空正文与图片缓存
                clearAllCaches();
                let rawDocs = JSON.parse(text) || [];
                rawDocs.forEach(d => {
                    if (!d.code || !d.code.startsWith('CM-')) d.code = generateDocCode();
                    if (!Array.isArray(d.attachments)) d.attachments = [];
                    if (typeof d.summary !== 'string') d.summary = '';
                    if (d.hasContent === undefined) d.hasContent = true;
                });
                docs = rawDocs;
                hideLoading();
                hideAuth();
                showApp();
                saveLocalDocs();
                updateSyncStatus('success', '已同步');
                if (isLoggingIn) { isLoggingIn = false; setLoginButtonLoading(false); }
                // 刷新/同步后自动恢复或刷新当前文档，无需再次点击列表
                await maybeRestoreDocView();
            } catch (e) {
                const status = e.status;
                if (status === 401 || status === 403) {
                    docs = [];
                    clearAllCaches();
                    await idbDel('kb_docs_index');
                    renderCategoryList();
                    renderTagList();
                    renderDocList();
                    updateSyncStatus('error', 'Token 错误');
                    showToast('访问令牌认证失败，请重新输入', 'error');
                    hideLoading();
                    if (isLoggingIn) { isLoggingIn = false; setLoginButtonLoading(false); }
                    else { hideApp(); fillAdvancedOptions(); showAuth(); }
                } else {
                    updateSyncStatus('error', '网络异常');
                    hideLoading();
                    if (isLoggingIn) { isLoggingIn = false; setLoginButtonLoading(false); }
                    else { hideApp(); fillAdvancedOptions(); showAuth(); }
                }
            }
        }
    </script>
</body>
</html>
