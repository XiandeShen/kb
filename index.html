            <!-- 列表面板 -->
            <div id="listPanel" class="w-full md:w-80 lg:w-96 bg-[#f5f7fa] border-r border-slate-200/80 flex flex-col flex-shrink-0 h-full relative">
                <div class="h-12 px-4 border-b border-slate-200/70 flex items-center justify-between gap-2 flex-shrink-0 bg-[#f5f7fa]">
                    <span id="listTitle" class="font-semibold text-[14px] text-slate-800 truncate min-w-0">所有条目</span>
                    <span id="docCountText" class="text-[12px] text-slate-400 flex-shrink-0 tabular-nums">0 个文档</span>
                </div>
                <div id="docList" class="flex-1 overflow-y-auto relative"></div>
            </div>

            <main id="mainPanel" class="hidden md:flex flex-1 bg-[#f7f8fa] flex-col overflow-hidden absolute md:relative inset-0 z-30 md:z-auto h-full w-full">
                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 text-center overflow-y-auto">
                    <i class="ri-draft-line text-6xl mb-4 opacity-40"></i>
                    <p class="text-[15px] font-medium">选择左侧列表中的文章查看，或新建知识条目</p>
                </div>

                <div id="viewPanel" class="hidden flex-1 flex flex-col overflow-hidden bg-white h-full relative">
                    <!-- 顶部渐隐，正文滚动时不与悬浮操作按钮互相干扰 -->
                    <div class="absolute inset-x-0 top-0 h-10 bg-gradient-to-b from-white via-white/80 to-transparent z-10 pointer-events-none"></div>
                    <button id="backToListBtn" class="md:hidden absolute top-2 left-3 z-20 flex items-center gap-1 px-2.5 py-1.5 text-[13px] font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100/80 rounded-lg transition">
                        <i class="ri-arrow-left-line text-base"></i><span>返回</span>
                    </button>
                    <div class="absolute top-2 right-3 md:right-4 z-20 flex items-center gap-1">
                        <button id="editDocBtn" class="px-2.5 py-1.5 text-[13px] font-medium text-slate-500 hover:text-brand-600 hover:bg-slate-100/80 rounded-lg flex items-center space-x-1 transition">
                            <i class="ri-edit-line"></i><span>编辑</span>
                        </button>
                        <button id="deleteDocBtn" class="px-2.5 py-1.5 text-[13px] font-medium text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg flex items-center space-x-1 transition">
                            <i class="ri-delete-bin-line"></i><span>删除</span>
                        </button>
                    </div>
                    <div id="viewScrollContainer" class="flex-1 overflow-y-auto px-4 pt-14 pb-4 md:p-10 w-full relative">
                        <div class="max-w-4xl mx-auto w-full pb-12">
                            <h1 id="viewTitle" class="text-2xl sm:text-[2rem] font-extrabold text-slate-900 mb-3 leading-tight"></h1>
                            <div class="flex flex-wrap items-center gap-3 text-[13px] text-slate-400 mb-6 pb-4 border-b border-slate-200">
                                <span id="viewDate"><i class="ri-time-line mr-1"></i>--</span>
                                <span id="viewCodeBtn" title="点击复制知识编码" class="cursor-pointer hover:text-brand-600 active:text-brand-700 transition flex items-center space-x-1 select-none outline-none focus:outline-none focus:ring-0">
                                    <i class="ri-barcode-line mr-0.5"></i>
                                    <span>编码:</span>
                                    <span id="viewCodeText" class="font-mono">--</span>
                                </span>
                                <span id="viewCategoryBadge" class="flex items-center min-w-0 max-w-[180px]">
                                    <i class="ri-bookmark-line mr-1 flex-shrink-0"></i>
                                    <span class="flex-shrink-0">分类:</span>
                                    <span id="viewCategoryText" class="ml-1 min-w-0 truncate">通用</span>
                                </span>
                                <div id="viewTags" class="flex flex-wrap items-center gap-x-3 gap-y-1"></div>
                            </div>
                            <div id="viewContent" class="markdown-body text-slate-700 text-[15px]"></div>
                            <div id="viewAttachments"></div>
                        </div>
                    </div>
                </div>

                <div id="editPanel" class="hidden flex-1 flex flex-col bg-white overflow-hidden h-full relative">
                    <!-- 与查看态一致的悬浮操作：无工具栏、无分割线 -->
                    <div class="absolute inset-x-0 top-0 h-10 bg-gradient-to-b from-white via-white/80 to-transparent z-10 pointer-events-none"></div>
                    <div class="absolute top-2 left-3 md:left-4 z-20 flex h-[32px] items-center gap-2">
                        <button id="cancelEditBtn" class="md:hidden flex items-center gap-1 px-2.5 py-1.5 text-[13px] font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100/80 rounded-lg transition">
                            <i class="ri-arrow-left-line text-base"></i><span>返回</span>
                        </button>
                        <span id="editorModeTitle" class="text-[13px] font-medium text-slate-400 whitespace-nowrap">编辑文章</span>
                    </div>
                    <div class="absolute top-2 right-3 md:right-4 z-20 flex items-center gap-1">
                        <button id="togglePreviewBtn" class="px-2.5 py-1.5 text-[13px] font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100/80 rounded-lg flex items-center gap-1 transition">
                            <i id="togglePreviewIcon" class="ri-eye-line"></i><span id="togglePreviewText">预览</span>
                        </button>
                        <button id="desktopCancelEditBtn" class="hidden md:flex px-2.5 py-1.5 text-[13px] font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100/80 rounded-lg items-center gap-1 transition">
                            <i class="ri-close-line"></i><span>取消</span>
                        </button>
                        <button id="saveDocBtn" class="px-2.5 py-1.5 text-[13px] font-semibold text-brand-600 hover:text-brand-700 hover:bg-brand-50 rounded-lg flex items-center gap-1 transition">
                            <i class="ri-save-line"></i><span>保存</span>
                        </button>
                    </div>
                    <div id="editScrollContainer" class="flex-1 overflow-y-auto px-4 pt-14 pb-4 md:px-6 md:pt-12 md:pb-6">
                        <div class="max-w-5xl mx-auto w-full space-y-4 pb-12">
                            <div>
                                <input type="text" id="editTitleInput" placeholder="输入文章标题..."
                                    class="w-full text-2xl font-bold bg-transparent border-b border-slate-200 pb-2 focus:outline-none focus:border-brand-500 text-slate-900 placeholder-slate-400">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)] gap-4">
                                <div>
                                    <label class="block text-[13px] font-medium text-slate-500 mb-1">分类</label>
                                    <input type="text" id="editCategoryInput" placeholder="例如：产品知识、FAQ..."
                                        class="w-full px-3.5 py-2.5 text-[14px] rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800">
                                </div>
                                <div>
                                    <label class="block text-[13px] font-medium text-slate-500 mb-1">标签（用逗号或空格隔开）</label>
                                    <div class="flex items-center gap-2">
                                        <input type="text" id="editTagsInput" placeholder="例如：甜虾 售后 质量说明"
                                            class="flex-1 min-w-0 px-3.5 py-2.5 text-[14px] rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800">
                                        <label class="urgent-label flex items-center flex-shrink-0 self-stretch cursor-pointer select-none" title="标记为紧急通知">
                                            <input type="checkbox" id="editUrgentInput" class="sr-only" aria-label="标记为紧急通知">
                                            <span class="urgent-toggle flex h-full w-[42px] items-center justify-center rounded-xl border border-slate-200 bg-slate-50 text-slate-400">
                                                <i class="ri-alarm-warning-line text-[18px] pointer-events-none"></i>
                                            </span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col h-[400px] md:h-[500px] border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50">
                                <div class="bg-slate-100 px-4 py-2.5 border-b border-slate-200 flex items-center justify-between text-[13px] text-slate-500 flex-shrink-0">
                                    <span class="font-medium truncate mr-2" id="uploadStatusTip">Markdown 源码（支持粘贴截图）</span>
                                    <label class="cursor-pointer text-brand-600 hover:underline flex items-center space-x-1 flex-shrink-0">
                                        <i class="ri-attachment-2"></i><span>上传附件</span>
                                        <input type="file" id="attachmentUploadInput" multiple class="hidden"
                                            accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.zip,.rar,.7z,.tar,.gz,.txt,.md,.json,.rtf,.odt,.ods,.odp,.pages,.numbers,.key">
                                    </label>
                                </div>
                                <textarea id="editContentInput" placeholder="使用 Markdown 语法编写内容..."
                                    class="flex-1 w-full p-4 bg-transparent font-mono text-[14px] leading-relaxed resize-none focus:outline-none text-slate-800 placeholder-slate-400"></textarea>
                                <div id="editPreview" class="hidden flex-1 w-full p-4 overflow-y-auto markdown-body text-slate-800 bg-white"></div>
                            </div>
                            <div class="pt-2">
                                <div class="text-[12px] font-semibold text-slate-400 uppercase tracking-wider mb-2">附件</div>
                                <div id="editAttachmentsList" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <button id="backToTopBtn" title="回到顶部" class="hidden fixed right-6 bottom-6 w-10 h-10 bg-slate-800/90 hover:bg-brand-600 active:bg-brand-600 text-white rounded-full shadow-2xl flex items-center justify-center transition-all duration-200 z-[60] backdrop-blur-md active:scale-95 outline-none focus:outline-none focus:ring-0 border-0">
        <i class="ri-arrow-up-line text-lg pointer-events-none"></i>
    </button>

    <!-- 图片查看器 -->
    <div id="imageModal" class="fixed inset-0 w-screen bg-slate-950 z-[300] flex items-center justify-center overflow-hidden hidden select-none">
        <div id="imageToolbar" class="absolute top-0 right-0 h-14 flex items-center space-x-1 sm:space-x-2 px-3 sm:px-6 lg:pl-2 lg:pr-3 z-[135] pointer-events-auto">
            <button id="downloadImageBtn" title="下载图片" class="w-9 h-9 no-sticky-hover flex items-center justify-center rounded-xl text-slate-300 hover:text-white transition-colors">
                <i class="ri-download-line text-lg pointer-events-none"></i>
            </button>
            <button id="closeImageModalBtn" title="关闭 (ESC)" class="w-9 h-9 no-sticky-hover flex items-center justify-center rounded-xl text-slate-300 hover:text-white transition-colors">
                <i class="ri-close-line text-lg pointer-events-none"></i>
            </button>
        </div>
        <div id="imageContainer" class="w-full h-full flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing p-4 touch-none relative">
            <img id="modalImageView" alt="全屏大图" draggable="false" class="absolute max-w-none max-h-none object-contain pointer-events-none origin-center transition-opacity duration-150">
        </div>
        <div id="galleryCounter" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-[135] px-3 py-1 rounded-full bg-slate-900/60 backdrop-blur-md text-white/90 text-[12px] font-medium tabular-nums pointer-events-none">1 / 1</div>
        <button id="prevImageBtn" type="button" title="上一张 (←)" class="hidden absolute left-3 sm:left-5 top-1/2 -translate-y-1/2 z-[135] w-11 h-11 rounded-full bg-slate-900/45 hover:bg-slate-900/75 active:bg-slate-900/85 text-white backdrop-blur-md flex items-center justify-center transition">
            <i class="ri-arrow-left-s-line text-2xl pointer-events-none"></i>
        </button>
        <button id="nextImageBtn" type="button" title="下一张 (→)" class="hidden absolute right-3 sm:right-5 top-1/2 -translate-y-1/2 z-[135] w-11 h-11 rounded-full bg-slate-900/45 hover:bg-slate-900/75 active:bg-slate-900/85 text-white backdrop-blur-md flex items-center justify-center transition">
            <i class="ri-arrow-right-s-line text-2xl pointer-events-none"></i>
        </button>
        <div id="galleryThumbs" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 z-[135] max-w-[92vw] flex items-center gap-2 overflow-x-auto"></div>
    </div>

    <div id="githubModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[145] flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="ri-github-fill text-2xl text-slate-800"></i>
                    <h3 class="font-bold text-base text-slate-900">GitHub 仓库配置</h3>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600">
                    <i class="ri-close-line text-xl"></i>
                </button>
            </div>
            <p class="text-[13px] text-slate-500 leading-relaxed">修改你的 GitHub 访问凭证与存储路径。</p>
            <div class="space-y-3">
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-[13px] font-medium text-slate-600">Personal Access Token (PAT)</label>
                        <button type="button" id="verifyTokenBtn" class="text-[12px] font-medium text-brand-600 hover:text-brand-700 transition">验证权限</button>
                    </div>
                    <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3.5 py-2.5 text-[14px] rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                    <p class="mt-1.5 text-[11px] text-slate-400 leading-relaxed">令牌保存在本机浏览器（localStorage），请勿在公用设备使用。</p>
                    <p id="verifyTokenStatus" class="hidden mt-1.5 text-[12px] leading-relaxed"></p>
                </div>
                <div>
                    <label class="block text-[13px] font-medium text-slate-600 mb-1">仓库路径 (Owner/Repo)</label>
                    <input type="text" id="ghRepoInput" value="XiandeShen/Xiande-kb" class="w-full px-3.5 py-2.5 text-[14px] rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-[13px] font-medium text-slate-600 mb-1">JSON 数据文件名</label>
                    <input type="text" id="ghPathInput" value="kb_docs.json" class="w-full px-3.5 py-2.5 text-[14px] rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>
            <div class="flex items-center justify-end space-x-2 pt-2">
                <button id="saveGithubConfigBtn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium text-[14px] rounded-xl transition">保存配置并同步</button>
            </div>
        </div>
    </div>

    <!-- 应用脚本：经典脚本按顺序加载，共享同一全局作用域，行为与原内联脚本一致 -->

    <script src="js/ui-core.js?v=20261113r"></script>
    <script src="js/attachments.js?v=20261113r"></script>
    <script src="js/doc-view.js?v=20261113r"></script>
    <script src="js/viewer.js?v=20261113r"></script>
    <script src="js/events.js?v=20261113r"></script>
    <script src="js/auth-sync.js?v=20261113r"></script>
    <script src="js/pwa.js?v=20261113r"></script>
</body>
