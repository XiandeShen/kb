                <div class="h-12 px-4 md:px-6 border-b border-slate-200 flex items-center justify-between bg-slate-50 flex-shrink-0">

                        <span id="editorModeTitle" class="font-bold text-xs text-slate-700">编辑文章</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="desktopCancelEditBtn" class="hidden md:inline-block px-3 py-1 text-xs text-slate-600 hover:bg-slate-200 rounded-xl transition">取消</button>
                        <button id="saveDocBtn" class="px-4 py-1.5 text-xs font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm transition flex items-center space-x-1">

                <div id="editScrollContainer" class="flex-1 overflow-y-auto p-4 md:p-6">

    <!-- GitHub Config Modal -->
    <div id="githubModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[145] flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="ri-github-fill text-2xl text-slate-800"></i>
                    <h3 class="font-bold text-base text-slate-900">GitHub 仓库配置</h3>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600">
                    <i class="ri-close-line text-xl"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">修改你的 GitHub 访问凭证与存储路径。</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Personal Access Token (PAT)</label>
                    <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">仓库路径 (Owner/Repo)</label>
                    <input type="text" id="ghRepoInput" value="XiandeShen/Xiande-kb" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">JSON 数据文件名</label>
                    <input type="text" id="ghPathInput" value="kb_docs.json" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>
            <div class="flex items-center justify-end space-x-2 pt-2">
                <button id="saveGithubConfigBtn" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl transition">保存配置并同步</button>
            </div>

    <!-- Application Logic -->
    <script>
        let docs = [];
        let currentDocId = null;
        let previousDocId = null; // 记录点“+”号前正在浏览的文章 ID，用于取消时恢复
        let activeCategory = 'ALL';
        let activeTag = null;
        let isEditing = false;
        let githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' };
        
        const imageJsonCache = {};

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toastText.textContent = msg;
            if (type === 'error') {
                toastIcon.className = 'ri-error-warning-line text-rose-400 text-sm';
            } else {
                toastIcon.className = 'ri-checkbox-circle-line text-emerald-400 text-sm';
            }

            toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
            }, 2000);
        }

        window.onload = function() {
            loadGithubConfig();

            if (!githubConfig.token) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('authOverlay').classList.remove('hidden');
            } else {
                document.getElementById('authOverlay').classList.add('hidden');
                pullFromGithub();
            }

            setupEventListeners();
            setupImageHandling();
            setupImageViewerModal();
            setupGlobalBackToTop();
        };

        document.getElementById('authSubmitBtn').onclick = () => {
            const token = document.getElementById('authTokInput').value.trim();
            const repo = document.getElementById('authRepoInput').value.trim() || 'XiandeShen/xiande-kb';
            if (!token) {
                showToast('请输入有效的 GitHub Token！', 'error');
                return;
            }
            githubConfig.token = token;
            githubConfig.repo = repo;
            githubConfig.path = 'kb_docs.json';
            localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
            
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('hidden');
            pullFromGithub();
        };

        function handleResetBinding() {
            if (confirm('确定要解除 GitHub 绑定并重置吗？')) {
                localStorage.removeItem('kb_gh_config');
                localStorage.removeItem('kb_docs');
                docs = [];
                githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' };
                document.getElementById('authTokInput').value = '';
                document.getElementById('authOverlay').classList.remove('hidden');
                document.getElementById('githubDropdown').classList.add('hidden');
                renderDocList();
            }
        }

        function generateDocCode() {
            return 'CM-' + Math.floor(1000 + Math.random() * 9000);
        }

        function loadLocalDocs() {
            const saved = localStorage.getItem('kb_docs');
            docs = saved ? JSON.parse(saved) : [];
            docs.forEach(d => {
                if (!d.code || !d.code.startsWith('CM-')) {
                    d.code = generateDocCode();
                }
            });
        }

        function saveLocalDocs() {
            localStorage.setItem('kb_docs', JSON.stringify(docs));
            renderCategoryList();
            renderTagList();
            renderDocList();
        }

        function renderCategoryList() {
            const categories = {};
            docs.forEach(d => categories[d.category] = (categories[d.category] || 0) + 1);

            document.getElementById('allCount').textContent = docs.length;
            
            const allNavBtn = document.getElementById('allDocsNavBtn');
            if (activeCategory === 'ALL' && !activeTag) {
                allNavBtn.className = 'nav-filter-btn active w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium bg-brand-50 text-brand-600';
            } else {
                allNavBtn.className = 'nav-filter-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition';
            }

            const catListEl = document.getElementById('categoryList');
            catListEl.innerHTML = '';

            allNavBtn.onclick = () => {
                activeCategory = 'ALL';
                activeTag = null;
                renderCategoryList();
                renderTagList();
                renderDocList();

                const sidebarScroll = document.getElementById('sidebarScrollContainer');
                if (sidebarScroll) sidebarScroll.scrollTop = 0;
                const docListEl = document.getElementById('docList');
                if (docListEl) docListEl.scrollTop = 0;

                if (window.innerWidth < 768) {
                    currentDocId = null;
                    document.getElementById('mainPanel').classList.add('hidden');
                }

                closeMobileSidebar();
            };

            Object.entries(categories).forEach(([cat, count]) => {
                const btn = document.createElement('button');
                const isSelected = (activeCategory === cat && !activeTag);
                btn.className = `w-full flex items-center justify-between px-3.5 py-2 rounded-xl text-xs font-medium transition ${isSelected ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-100'}`;
                btn.innerHTML = `<span class="truncate">${cat}</span><span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100">${count}</span>`;
                btn.onclick = () => {
                    activeCategory = cat;
                    activeTag = null;
                    renderCategoryList();
                    renderTagList();
                    renderDocList();
                    
                    const sidebarScroll = document.getElementById('sidebarScrollContainer');
                    if (sidebarScroll) sidebarScroll.scrollTop = 0;
                    const docListEl = document.getElementById('docList');
                    if (docListEl) docListEl.scrollTop = 0;

                    if (window.innerWidth < 768) {
                        currentDocId = null;
                        document.getElementById('mainPanel').classList.add('hidden');
                    }

                    closeMobileSidebar();
                };
                catListEl.appendChild(btn);
            });
        }

        function renderTagList() {
            const tags = new Set();
            docs.forEach(d => (d.tags || []).forEach(t => tags.add(t)));
            const tagListEl = document.getElementById('tagList');
            tagListEl.innerHTML = '';

            tags.forEach(t => {
                const badge = document.createElement('span');
                const isSelected = (activeTag === t);
                badge.className = `px-2.5 py-1 text-xs rounded-lg cursor-pointer transition ${isSelected ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                badge.textContent = `# ${t}`;
                badge.onclick = () => {
                    activeTag = activeTag === t ? null : t;
                    if (activeTag) {
                        activeCategory = 'ALL';
                    }
                    renderCategoryList();
                    renderTagList();
                    renderDocList();

                    const sidebarScroll = document.getElementById('sidebarScrollContainer');
                    if (sidebarScroll) sidebarScroll.scrollTop = 0;
                    const docListEl = document.getElementById('docList');
                    if (docListEl) docListEl.scrollTop = 0;

                    if (window.innerWidth < 768) {
                        currentDocId = null;
                        document.getElementById('mainPanel').classList.add('hidden');
                    }

                    closeMobileSidebar();
                };
                tagListEl.appendChild(badge);
            });
        }

        function renderDocList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = docs.filter(d => {
                const matchSearch = d.title.toLowerCase().includes(query) || d.content.toLowerCase().includes(query) || (d.code && d.code.toLowerCase().includes(query)) || (d.tags && d.tags.some(t => t.toLowerCase().includes(query)));
                const matchCat = activeCategory === 'ALL' || d.category === activeCategory;
                const matchTag = !activeTag || (d.tags && d.tags.includes(activeTag));
                return matchSearch && matchCat && matchTag;
            });

            const listTitleEl = document.getElementById('listTitle');
            if (query) {
                listTitleEl.textContent = `搜索: "${query}"`;
            } else if (activeTag) {
                listTitleEl.textContent = `# ${activeTag}`;
            } else if (activeCategory !== 'ALL') {
                listTitleEl.textContent = activeCategory;
            } else {
                listTitleEl.textContent = '所有条目';
            }

            document.getElementById('docCountText').textContent = `${filtered.length} 个文档`;
            const docListEl = document.getElementById('docList');
            docListEl.innerHTML = '';

            filtered.forEach(d => {
                const item = document.createElement('div');
                const isSelected = currentDocId === d.id;
                item.className = `relative p-4 cursor-pointer hover:bg-slate-100 transition ${isSelected ? 'bg-brand-50/70' : ''}`;
                
                let html = '';
                if (isSelected) {
                    html += `<div class="absolute left-0 inset-y-0 w-1 bg-brand-600 rounded-r"></div>`;
                }
                html += `
                    <h4 class="font-bold text-xs text-slate-800 truncate pr-16">${d.title || '无标题'}</h4>
                    <p class="text-[11px] text-slate-500 line-clamp-2 mt-1">${d.content.replace(/[#*`!]/g, '')}</p>
                    <div class="flex items-center justify-between text-[10px] text-slate-400 mt-2">
                        <span class="px-1.5 py-0.5 rounded bg-slate-100 truncate max-w-[110px]">${d.category}</span>
                        <div class="flex items-center space-x-1.5">
                            <span class="font-mono text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded font-semibold">${d.code || ''}</span>
                            <span>${d.updatedAt ? d.updatedAt.split(' ')[0] : ''}</span>
                        </div>
                    </div>
                `;
                item.innerHTML = html;
                item.onclick = () => openDocView(d.id);
                docListEl.appendChild(item);
            });
        }

        async function openDocView(id) {
            currentDocId = id;
            previousDocId = id; // 更新当前浏览的文章记录
            isEditing = false;
            const doc = docs.find(d => d.id === id);
            if (!doc) return;

            const viewScrollEl = document.getElementById('viewScrollContainer');
            if (viewScrollEl) {
                viewScrollEl.scrollTop = 0;
            }

            const loadingOverlay = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').textContent = '正在加载文章及高清图片...';
            loadingOverlay.classList.remove('hidden');

            const parsedHtml = marked.parse(doc.content || '');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = parsedHtml;
            const imgTags = tempDiv.querySelectorAll('img');
            const imagePromises = [];

            imgTags.forEach(img => {
                const src = img.getAttribute('src');
                if (src && src.startsWith('images/') && src.endsWith('.json')) {
                    const p = new Promise(async (resolve) => {
                        if (imageJsonCache[src]) {
                            img.src = imageJsonCache[src];
                            resolve();
                            return;
                        }
                        try {
                            const base64Data = await fetchImageJsonFromGithub(src);
                            if (base64Data) {
                                imageJsonCache[src] = base64Data;
                                img.src = base64Data;
                                await new Promise((resImg) => {
                                    const testImg = new Image();
                                    testImg.onload = resImg;
                                    testImg.onerror = resImg;
                                    testImg.src = base64Data;
                                });
                            }
                        } catch (e) {}
                        resolve();
                    });
                    imagePromises.push(p);
                }
            });

            await Promise.all(imagePromises);
            loadingOverlay.classList.add('hidden');

            const mainPanel = document.getElementById('mainPanel');
            mainPanel.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editPanel').classList.add('hidden');
            document.getElementById('viewPanel').classList.remove('hidden');

            document.getElementById('viewTitle').textContent = doc.title;
            document.getElementById('viewCategoryBadge').textContent = doc.category;
            document.getElementById('viewDate').innerHTML = `<i class="ri-time-line mr-1"></i>修改于: ${doc.updatedAt || '未知'}`;
            
            const codeTextEl = document.getElementById('viewCodeText');
            codeTextEl.textContent = doc.code || 'CM-0000';
            const codeBtn = document.getElementById('viewCodeBtn');
            
            const handleCodeCopy = (e) => {
                if (e) e.preventDefault();
                navigator.clipboard.writeText(doc.code || '').then(() => {
                    showToast(`已复制知识编码: ${doc.code}`, 'success');
                }).catch(() => {
                    showToast(`已复制知识编码: ${doc.code}`, 'success');
                });
                codeBtn.blur();
                codeBtn.classList.remove('active');
            };
            codeBtn.onclick = handleCodeCopy;
            codeBtn.ontouchend = handleCodeCopy;

            document.getElementById('viewContent').innerHTML = tempDiv.innerHTML;

            const renderedImages = document.getElementById('viewContent').querySelectorAll('img');
            renderedImages.forEach(imgEl => {
                imgEl.onclick = () => {
                    openImageViewerModal(imgEl.src);
                };
            });

            const tagsContainer = document.getElementById('viewTags');
            tagsContainer.innerHTML = '';
            (doc.tags || []).forEach(t => {
                const tagEl = document.createElement('span');
                tagEl.className = 'px-2.5 py-0.5 rounded-lg text-xs bg-slate-100 text-slate-500';
                tagEl.textContent = `# ${t}`;
                tagsContainer.appendChild(tagEl);
            });

            if (viewScrollEl) {
                viewScrollEl.scrollTop = 0;
            }

            renderDocList();
            checkBackToTopBtnVisibility();
        }

        function setupGlobalBackToTop() {
            const btn = document.getElementById('backToTopBtn');
            const viewScroll = document.getElementById('viewScrollContainer');
            const editScroll = document.getElementById('editScrollContainer');

            window.checkBackToTopBtnVisibility = function() {
                let currentScrollTop = 0;
                if (!document.getElementById('viewPanel').classList.contains('hidden')) {
                    currentScrollTop = viewScroll.scrollTop;
                } else if (!document.getElementById('editPanel').classList.contains('hidden')) {
                    currentScrollTop = editScroll.scrollTop;
                }
                
                if (currentScrollTop > 200) {
                    btn.classList.remove('hidden');
                } else {
                    btn.classList.add('hidden');
                }
            };

            viewScroll.addEventListener('scroll', checkBackToTopBtnVisibility);
            editScroll.addEventListener('scroll', checkBackToTopBtnVisibility);

            btn.onclick = () => {
                if (!document.getElementById('viewPanel').classList.contains('hidden')) {
                    viewScroll.scrollTo({ top: 0, behavior: 'smooth' });
                } else if (!document.getElementById('editPanel').classList.contains('hidden')) {
                    editScroll.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
        }

        let currentModalImgSrc = '';
        let currentScale = 1;
        let minScale = 1;
        let maxScale = 5;
        let imgTranslateX = 0;
        let imgTranslateY = 0;
        let isDraggingImg = false;
        let startDragX = 0, startDragY = 0;
        let initialPinchDistance = null;
        let initialPinchScale = 1;

        function setupImageViewerModal() {
            const modal = document.getElementById('imageModal');
            const closeBtn = document.getElementById('closeImageModalBtn');
            const downloadBtn = document.getElementById('downloadImageBtn');
            const container = document.getElementById('imageContainer');
            const imgView = document.getElementById('modalImageView');

            const closeModal = () => {
                modal.classList.add('hidden');
            };

            closeBtn.onclick = closeModal;

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    closeModal();
                }
            });

            downloadBtn.onclick = async () => {
                if (!currentModalImgSrc) return;
                try {
                    const response = await fetch(currentModalImgSrc);
                    const blob = await response.blob();
                    const isPng = blob.type.includes('png');
                    const ext = isPng ? 'png' : 'jpg';
                    const blobUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = `knowledge_image_${Date.now()}.${ext}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    showToast(`图片已成功下载`, 'success');
                } catch (err) {
                    const a = document.createElement('a');
                    a.href = currentModalImgSrc;
                    a.download = `knowledge_image_${Date.now()}.png`;
                    a.target = '_blank';
                    a.click();
                    showToast('图片下载已触发', 'success');
                }
            };

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.15;
                let newScale = e.deltaY < 0 ? currentScale + zoomFactor : currentScale - zoomFactor;
                
                if (newScale < minScale) newScale = minScale;
                if (newScale > maxScale) newScale = maxScale;
                
                currentScale = newScale;
                clampTranslation();
                updateImageTransform();
            }, { passive: false });

            container.addEventListener('mousedown', (e) => {
                isDraggingImg = true;
                startDragX = e.clientX - imgTranslateX;
                startDragY = e.clientY - imgTranslateY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingImg) return;
                imgTranslateX = e.clientX - startDragX;
                imgTranslateY = e.clientY - startDragY;
                clampTranslation();
                updateImageTransform();
            });

            window.addEventListener('mouseup', () => {
                isDraggingImg = false;
            });

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDraggingImg = true;
                    startDragX = e.touches[0].clientX - imgTranslateX;
                    startDragY = e.touches[0].clientY - imgTranslateY;
                } else if (e.touches.length === 2) {
                    isDraggingImg = false;
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialPinchScale = currentScale;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (isDraggingImg && e.touches.length === 1) {
                    imgTranslateX = e.touches[0].clientX - startDragX;
                    imgTranslateY = e.touches[0].clientY - startDragY;
                    clampTranslation();
                    updateImageTransform();
                } else if (e.touches.length === 2 && initialPinchDistance) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let newScale = initialPinchScale * (dist / initialPinchDistance);
                    if (newScale < minScale) newScale = minScale;
                    if (newScale > maxScale) newScale = maxScale;
                    currentScale = newScale;
                    clampTranslation();
                    updateImageTransform();
                }
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    isDraggingImg = false;
                }
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            });
        }

        function clampTranslation() {
            const imgView = document.getElementById('modalImageView');
            if (!imgView.naturalWidth) return;
            const containerW = window.innerWidth;
            const containerH = window.innerHeight;
            
            const renderedW = imgView.naturalWidth * currentScale;
            const renderedH = imgView.naturalHeight * currentScale;

            const maxTransX = Math.max(0, (renderedW - containerW) / 2 + 100);
            const maxTransY = Math.max(0, (renderedH - containerH) / 2 + 100);

            imgTranslateX = Math.min(Math.max(imgTranslateX, -maxTransX), maxTransX);
            imgTranslateY = Math.min(Math.max(imgTranslateY, -maxTransY), maxTransY);
        }

        function openImageViewerModal(src) {
            currentModalImgSrc = src;
            const modal = document.getElementById('imageModal');
            const imgView = document.getElementById('modalImageView');
            
            imgView.src = src;
            imgTranslateX = 0;
            imgTranslateY = 0;

            imgView.onload = () => {
                const containerW = window.innerWidth * 0.85;
                const containerH = window.innerHeight * 0.85;
                const natW = imgView.naturalWidth || 800;
                const natH = imgView.naturalHeight || 600;

                const scaleW = containerW / natW;
                const scaleH = containerH / natH;
                minScale = Math.min(scaleW, scaleH, 1.0);
                currentScale = minScale;
                maxScale = Math.max(minScale * 5, 5.0);

                imgView.style.width = natW + 'px';
                imgView.style.height = natH + 'px';
                
                updateImageTransform();
                modal.classList.remove('hidden');
            };
        }

        function updateImageTransform() {
            const imgView = document.getElementById('modalImageView');
            imgView.style.transform = `translate3d(${imgTranslateX}px, ${imgTranslateY}px, 0px) scale(${currentScale})`;
        }

        async function fetchImageJsonFromGithub(path) {
            if (!githubConfig.token || !githubConfig.repo) return null;
            const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${path}`, {
                headers: { 'Authorization': `token ${githubConfig.token}` }
            });
            if (res.ok) {
                const fileData = await res.json();
                const jsonStr = decodeURIComponent(escape(atob(fileData.content)));
                const obj = JSON.parse(jsonStr);
                return obj.data;
            }
            return null;
        }

        function setupImageHandling() {
            const textarea = document.getElementById('editContentInput');
            const fileInput = document.getElementById('imageUploadInput');

            textarea.addEventListener('paste', function(e) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let item of items) {
                    if (item.type.indexOf('image') === 0) {
                        e.preventDefault();
                        uploadImageAsJson(item.getAsFile());
                    }
                }
            });

            fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    uploadImageAsJson(e.target.files[0]);
                }
            });
        }

        async function uploadImageAsJson(file) {
            if (!githubConfig.token || !githubConfig.repo) {
                showToast('请先绑定 GitHub Token！', 'error');
                return;
            }

            const tipEl = document.getElementById('uploadStatusTip');
            tipEl.textContent = '正在压缩图片并打包为独立 JSON 上传...';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxWidth = 1200;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64DataUrl = canvas.toDataURL('image/webp', 0.7);
                    const payload = { data: base64DataUrl };
                    const jsonString = JSON.stringify(payload);
                    const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));
                    const filename = `images/img_${Date.now()}.json`;

                    try {
                        const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${filename}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${githubConfig.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `kb: upload image json ${filename}`,
                                content: contentEncoded
                            })
                        });

                        if (res.ok) {
                            insertAtCursor(document.getElementById('editContentInput'), `\n![图片](${filename})\n`);
                            tipEl.textContent = 'Markdown 源码（独立 JSON 图片上传成功！）';
                            showToast('图片上传成功并已插入', 'success');
                        } else {
                            showToast('图片上传 GitHub 失败。', 'error');
                            tipEl.textContent = 'Markdown 源码（上传失败）';
                        }
                    } catch (err) {
                        showToast('网络异常，图片上传失败', 'error');
                        tipEl.textContent = 'Markdown 源码（上传异常）';
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function deleteGithubImageJsonsInContent(content) {
            if (!githubConfig.token || !githubConfig.repo || !content) return;
            
            const regex = /images\/img_\d+\.json/g;
            const matches = content.match(regex);
            if (!matches) return;

            for (let jsonPath of matches) {
                try {
                    const getRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${jsonPath}`, {
                        headers: { 'Authorization': `token ${githubConfig.token}` }
                    });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${jsonPath}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `token ${githubConfig.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `kb: delete unused image json ${jsonPath}`,
                                sha: fileData.sha
                            })
                        });
                    }
                } catch (e) {}
            }
        }

        function insertAtCursor(textarea, text) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + text.length;
        }

        function closeMobileSidebar() {
            if (window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            function handleSearchInput() {
                const val = searchInput.value;
                if (val.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                renderDocList();
            }

            searchInput.oninput = handleSearchInput;

            clearSearchBtn.onclick = () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderDocList();
                searchInput.focus();
            };

            // 点击新建 (+) 号时：暂存当前的浏览文章 ID，然后切换到新建编辑面板
            document.getElementById('newDocBtn').onclick = () => {
                if (currentDocId) {
                    previousDocId = currentDocId; // 暂存当前正在预览的文章 ID
                }
                currentDocId = null;
                isEditing = true;
                renderDocList(); 

                const mainPanel = document.getElementById('mainPanel');
                mainPanel.classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('viewPanel').classList.add('hidden');
                document.getElementById('editPanel').classList.remove('hidden');

                document.getElementById('editorModeTitle').textContent = '新建知识条目';
                document.getElementById('editTitleInput').value = '';
                document.getElementById('editCategoryInput').value = activeCategory !== 'ALL' ? activeCategory : '通用';
                document.getElementById('editTagsInput').value = '';
                document.getElementById('editContentInput').value = '';
                closeMobileSidebar();
                checkBackToTopBtnVisibility();
            };

            document.getElementById('editDocBtn').onclick = () => {
                const doc = docs.find(d => d.id === currentDocId);
                if (!doc) return;
                isEditing = true;
                document.getElementById('viewPanel').classList.add('hidden');
                document.getElementById('editPanel').classList.remove('hidden');

                document.getElementById('editorModeTitle').textContent = '编辑文章';
                document.getElementById('editTitleInput').value = doc.title;
                document.getElementById('editCategoryInput').value = doc.category;
                document.getElementById('editTagsInput').value = (doc.tags || []).join(' ');
                document.getElementById('editContentInput').value = doc.content;
                checkBackToTopBtnVisibility();
            };

            // 核心优化：点击取消/返回时，若之前有正在浏览的文章，则无缝恢复到该文章的预览状态
            const handleCancelEdit = () => {
                if (previousDocId && docs.some(d => d.id === previousDocId)) {
                    openDocView(previousDocId); // 恢复到之前预览的文章
                } else {
                    currentDocId = null;
                    document.getElementById('editPanel').classList.add('hidden');
                    if (window.innerWidth < 768) {
                        document.getElementById('mainPanel').classList.add('hidden');
                    } else {
                        document.getElementById('emptyState').classList.remove('hidden');
                    }
                    renderDocList();
                }
                checkBackToTopBtnVisibility();
            };
            document.getElementById('cancelEditBtn').onclick = handleCancelEdit;
            document.getElementById('desktopCancelEditBtn').onclick = handleCancelEdit;

            document.getElementById('backToListBtn').onclick = () => {
                currentDocId = null;
                previousDocId = null;
                document.getElementById('mainPanel').classList.add('hidden');
                renderDocList();
                checkBackToTopBtnVisibility();
            };

            document.getElementById('saveDocBtn').onclick = () => {
                const title = document.getElementById('editTitleInput').value.trim() || '未命名文章';
                const category = document.getElementById('editCategoryInput').value.trim() || '通用';
                const tagsStr = document.getElementById('editTagsInput').value.trim();
                const tags = tagsStr ? tagsStr.split(/[,，\s]+/) : [];
                const content = document.getElementById('editContentInput').value;
                const now = new Date().toLocaleString();

                if (currentDocId) {
                    const doc = docs.find(d => d.id === currentDocId);
                    if (doc) {
                        doc.title = title;
                        doc.category = category;
                        doc.tags = tags;
                        doc.content = content;
                        doc.updatedAt = now;
                        if (!doc.code || !doc.code.startsWith('CM-')) doc.code = generateDocCode();
                    }
                } else {
                    const newDoc = {
                        id: 'doc-' + Date.now(),
                        code: generateDocCode(),
                        title, category, tags, content, updatedAt: now
                    };
                    docs.unshift(newDoc);
                    currentDocId = newDoc.id;
                    previousDocId = newDoc.id;
                }

                saveLocalDocs();
                openDocView(currentDocId);
                syncToGithub();
                showToast('保存成功并已同步', 'success');
            };

            document.getElementById('deleteDocBtn').onclick = async () => {
                if (!confirm('确定要删除这篇知识条目吗？关联的独立图片 JSON 会同步从 GitHub 中清理。')) return;
                
                const docToDelete = docs.find(d => d.id === currentDocId);
                if (docToDelete && docToDelete.content) {
                    await deleteGithubImageJsonsInContent(docToDelete.content);
                }

                docs = docs.filter(d => d.id !== currentDocId);
                currentDocId = null;
                previousDocId = null;
                saveLocalDocs();
                document.getElementById('viewPanel').classList.add('hidden');
                if (window.innerWidth < 768) {
                    document.getElementById('mainPanel').classList.add('hidden');
                } else {
                    document.getElementById('emptyState').classList.add('hidden');
                }
                syncToGithub();
                showToast('删除成功', 'success');
                checkBackToTopBtnVisibility();
            };

            const githubBtn = document.getElementById('githubConfigBtn');
            const githubDropdown = document.getElementById('githubDropdown');

            githubBtn.onclick = (e) => {
                e.stopPropagation();
                githubDropdown.classList.toggle('hidden');
            };

            document.addEventListener('click', (e) => {
                if (!githubBtn.contains(e.target) && !githubDropdown.contains(e.target)) {
                    githubDropdown.classList.add('hidden');
                }
            });

            document.getElementById('menuConfigBtn').onclick = () => {
                githubDropdown.classList.add('hidden');
                document.getElementById('ghTokenInput').value = githubConfig.token;
                document.getElementById('ghRepoInput').value = githubConfig.repo || 'XiandeShen/Xiande-kb';
                document.getElementById('ghPathInput').value = githubConfig.path || 'kb_docs.json';
                document.getElementById('githubModal').classList.remove('hidden');
            };

            document.getElementById('menuResetBtn').onclick = () => {
                handleResetBinding();
            };

            document.getElementById('closeModalBtn').onclick = () => {
                document.getElementById('githubModal').classList.add('hidden');
            };

            document.getElementById('saveGithubConfigBtn').onclick = () => {
                githubConfig.token = document.getElementById('ghTokenInput').value.trim();
                githubConfig.repo = document.getElementById('ghRepoInput').value.trim() || 'XiandeShen/Xiande-kb';
                githubConfig.path = document.getElementById('ghPathInput').value.trim() || 'kb_docs.json';
                localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
                document.getElementById('githubModal').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('hidden');
                pullFromGithub();
                showToast('GitHub 配置已保存', 'success');
            };

            const sidebar = document.getElementById('sidebar');
            const sidebarScroll = document.getElementById('sidebarScrollContainer');
            const overlay = document.getElementById('sidebarOverlay');
            
            document.getElementById('mobileMenuBtn').onclick = () => {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                if (sidebarScroll) {
                    sidebarScroll.scrollTop = 0;
                }
            };

            overlay.onclick = () => {
                closeMobileSidebar();
            };
        }

        function loadGithubConfig() {
            const saved = localStorage.getItem('kb_gh_config');
            if (saved) {
                githubConfig = JSON.parse(saved);
                if (!githubConfig.repo) githubConfig.repo = 'XiandeShen/Xiande-kb';
            }
        }

        function updateSyncStatus(type, msg) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            if (!dot || !text) return;
            if (type === 'success') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0';
                text.textContent = msg || '已同步';
            } else if (type === 'loading') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse flex-shrink-0';
                text.textContent = msg || '同步中';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
                text.textContent = msg || '同步失败';
            }
        }

        async function pullFromGithub() {
            if (!githubConfig.token || !githubConfig.repo) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('authOverlay').classList.remove('hidden');
                return;
            }
            updateSyncStatus('loading', '同步中');
            document.getElementById('loadingText').textContent = '正在从云端拉取知识库...';

            try {
                const actualRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.path}`, {
                    headers: { 'Authorization': `token ${githubConfig.token}` }
                });

                if (actualRes.ok) {
                    const data = await actualRes.json();
                    githubConfig.sha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    docs = JSON.parse(content);
                    docs.forEach(d => {
                        if (!d.code || !d.code.startsWith('CM-')) d.code = generateDocCode();
                    });
                    saveLocalDocs();
                    updateSyncStatus('success', '已同步');
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    document.getElementById('authOverlay').classList.add('hidden');
                } else if (actualRes.status === 404) {
                    await syncToGithub();
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    document.getElementById('authOverlay').classList.add('hidden');
                } else {
                    docs = [];
                    localStorage.removeItem('kb_docs');
                    renderDocList();
                    updateSyncStatus('error', 'Token 错误');
                    showToast('Token 认证失败，请重新输入！', 'error');
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    document.getElementById('authOverlay').classList.remove('hidden');
                }
            } catch (e) {
                updateSyncStatus('error', '网络异常');
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('authOverlay').classList.remove('hidden');
            }
        }

        async function syncToGithub() {
            if (!githubConfig.token || !githubConfig.repo) return;
            updateSyncStatus('loading', '同步中');

            try {
                if (!githubConfig.sha) {
                    try {
                        const checkRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.path}`, {
                            headers: { 'Authorization': `token ${githubConfig.token}` }
                        });
                        if (checkRes.ok) {
                            const checkData = await checkRes.json();
                            githubConfig.sha = checkData.sha;
                        }
                    } catch (ex) {}
                }

                const jsonStr = JSON.stringify(docs, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonStr)));

                const body = {
                    message: `kb: update docs ${new Date().toLocaleString()}`,
                    content: contentEncoded
                };
                if (githubConfig.sha) body.sha = githubConfig.sha;

                const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    const data = await res.json();
                    githubConfig.sha = data.content.sha;
                    localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
                    updateSyncStatus('success', '已同步');
                } else {
                    const errJson = await res.json().catch(() => ({}));
                    if (res.status === 409 && githubConfig.sha) {
                        githubConfig.sha = '';
                        return syncToGithub();
                    }
                    updateSyncStatus('error', errJson.message || '推送失败');
                }
            } catch (e) {
                updateSyncStatus('error', '推送失败');
            }
        }
    </script>
