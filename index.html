    <style>
        * { box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        button, a, input { -webkit-tap-highlight-color: transparent; }
        @media (hover: hover) { .no-sticky-hover:hover { background-color: rgb(30 41 59); } }
        .no-sticky-hover:active { background-color: rgb(30 41 59) !important; }
        .markdown-body { word-break: break-word; overflow-wrap: break-word; font-size: 15px; }
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 12px 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); background: #f1f5f9; cursor: zoom-in; }
        .markdown-body p { margin-bottom: 0.8rem; line-height: 1.7; color: inherit; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: inherit; }
        .markdown-body h1 { font-size: 1.55rem; }
        .markdown-body h2 { font-size: 1.3rem; }
        .markdown-body h3 { font-size: 1.15rem; }
        .markdown-body code { background: rgba(110, 118, 129, 0.1); padding: 0.2em 0.4em; border-radius: 6px; font-size: 85%; word-break: break-all; }
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; }
        .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.8rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.8rem; }
        .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #64748b; margin: 1rem 0; }

        /* ===== Markdown 图片加载态（避免浏览器原生的“图片损坏”占位） ===== */
        .markdown-body .md-img-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            background: transparent;
            vertical-align: middle;
        }
        .markdown-body .md-img-frame.is-loading {
            min-height: 180px;
            background: linear-gradient(100deg, #eef2f7 25%, #f8fafc 37%, #eef2f7 63%);
            background-size: 400% 100%;
            animation: mdImgShimmer 1.4s ease infinite;
        }
        .markdown-body .md-img-frame.is-error {
            min-height: 120px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            cursor: pointer;
        }
        .markdown-body .md-img-frame img.md-img {
            margin: 0;
            box-shadow: none;
            max-width: 100%;
            opacity: 0;
            transition: opacity .25s ease;
        }
        .markdown-body .md-img-frame.is-loading img.md-img,
        .markdown-body .md-img-frame.is-error img.md-img { display: none; }
        .markdown-body .md-img-frame.is-ready img.md-img { opacity: 1; cursor: zoom-in; }
        .md-img-spinner {
            display: none;
            position: absolute;
            inset: 0;
            margin: auto;
            width: 24px;
            height: 24px;
            border: 2.5px solid #dbe3ec;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: mdImgSpin .8s linear infinite;
        }
        .md-img-frame.is-loading .md-img-spinner { display: block; }
        .md-img-error {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            padding: 12px;
        }
        .md-img-error i { font-size: 22px; }
        .md-img-frame.is-error .md-img-error { display: flex; }
        @keyframes mdImgShimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
        @keyframes mdImgSpin { to { transform: rotate(360deg); } }

        /* ===== 品牌字体：椿沐智库 ===== */
        .brand-title {
            font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 1;
            display: inline-block;
        }

        /* ===== 自定义滚动条：浅色区域（Firefox） ===== */
        #docList, #viewScrollContainer, #editScrollContainer, #editContentInput {
            scrollbar-width: thin;
            scrollbar-color: #dbe2ea transparent;
        }
        /* ===== 自定义滚动条：深色侧边栏（移动端，Firefox） ===== */
        #sidebarScrollContainer {
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }

        /* ===== 列表滚动条 ===== */
        #docList { -webkit-overflow-scrolling: touch; background: #f5f7fa; }
        #docList::-webkit-scrollbar { width: 6px; height: 6px; }
        #docList::-webkit-scrollbar-track { background: transparent; }
        #docList::-webkit-scrollbar-thumb { background: #dbe2ea; border-radius: 999px; }
        #docList::-webkit-scrollbar-thumb:hover { background: #c7d0da; }

        /* ===== 侧边栏滚动条（移动端深色） ===== */
        #sidebarScrollContainer::-webkit-scrollbar { width: 6px; height: 6px; }
        #sidebarScrollContainer::-webkit-scrollbar-track { background: transparent; }
        #sidebarScrollContainer::-webkit-scrollbar-thumb { background: #475569; border-radius: 999px; }
        #sidebarScrollContainer::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* ===== 侧边栏滚动条（PC 浅色） ===== */
        @media (min-width: 1024px) {
            #sidebarScrollContainer { scrollbar-color: #bcc7d5 transparent; }
            #sidebarScrollContainer::-webkit-scrollbar-thumb { background: #bcc7d5; }
            #sidebarScrollContainer::-webkit-scrollbar-thumb:hover { background: #a3b0c0; }
        }

        /* ===== 右侧内容区 / 编辑器滚动条 ===== */
        #viewScrollContainer::-webkit-scrollbar,
        #editScrollContainer::-webkit-scrollbar,
        #editContentInput::-webkit-scrollbar { width: 6px; height: 6px; }
        #viewScrollContainer::-webkit-scrollbar-track,
        #editScrollContainer::-webkit-scrollbar-track,
        #editContentInput::-webkit-scrollbar-track { background: transparent; }
        #viewScrollContainer::-webkit-scrollbar-thumb,
        #editScrollContainer::-webkit-scrollbar-thumb,
        #editContentInput::-webkit-scrollbar-thumb { background: #dbe2ea; border-radius: 999px; }
        #viewScrollContainer::-webkit-scrollbar-thumb:hover,
        #editScrollContainer::-webkit-scrollbar-thumb:hover,
        #editContentInput::-webkit-scrollbar-thumb:hover { background: #c7d0da; }

        /* ===== 登录页滚动条 ===== */
        #authOverlay { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,0.35) transparent; }
        #authOverlay::-webkit-scrollbar { width: 6px; }
        #authOverlay::-webkit-scrollbar-track { background: transparent; }
        #authOverlay::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 999px; }
        #authOverlay::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.55); }

        @media (max-width: 767px) {
            #docList { padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); }
            #viewAttachments { padding-right: 4.5rem; }
            #viewScrollContainer > div { padding-bottom: 5rem; }
        }
        #backToTopBtn { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; outline: none; }
        #backToTopBtn:active, #backToTopBtn:focus, #backToTopBtn:focus-visible, #backToTopBtn:hover {
            background-color: rgb(30 41 59) !important; outline: none !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25) !important;
        }
        #advancedOptions { transition: max-height 0.3s ease, opacity 0.2s ease; overflow: hidden; max-height: 0; opacity: 0; }
        #advancedOptions.is-open { max-height: 320px; opacity: 1; }
        #advancedChevron { transition: transform 0.25s ease; }
        #advancedChevron.is-open { transform: rotate(180deg); }
        #syncRefreshBtn { -webkit-tap-highlight-color: transparent; }
        #syncRefreshBtn:active { transform: scale(0.9); }
        #confirmModal .confirm-card { animation: confirmPop 0.18s ease-out; }
        @keyframes confirmPop { 0% { opacity: 0; transform: scale(0.96) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* ===== 列表卡片 ===== */
        .doc-card {
            background: #fff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            -webkit-tap-highlight-color: transparent;
            transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease, transform .16s ease;
        }
        .doc-card:hover {
            border-color: #cbd5e1;
            background: #fdfefe;
            box-shadow: 0 4px 10px -4px rgba(15, 23, 42, 0.14);
        }
        .doc-card:active { transform: scale(0.992); }
        .doc-card.is-selected {
            background: linear-gradient(180deg, #eef5ff 0%, #ffffff 88%);
            border-color: #bfdbfe;
            box-shadow: 0 3px 12px -6px rgba(37, 99, 235, 0.35);
        }
        .doc-card.is-selected:hover { border-color: #93c5fd; }

        /* ===== 图片查看器顶部按钮区：与顶栏右侧按钮对齐 ===== */
        #imageModal > .fixed.top-0.right-0 { padding-right: 12px; }
        @media (min-width: 640px) { #imageModal > .fixed.top-0.right-0 { padding-right: 24px; } }
        @media (min-width: 1024px) { #imageModal > .fixed.top-0.right-0 { padding-right: 12px; } }
        /* 移动端用左右滑动换图，隐藏上一张/下一张按钮 */
        @media (max-width: 767px) {
            #prevImageBtn, #nextImageBtn { display: none !important; }
        }

        /* ===== 编辑预览 ===== */
        #editPreview { scrollbar-width: thin; scrollbar-color: #dbe2ea transparent; }
        #editPreview::-webkit-scrollbar { width: 6px; height: 6px; }
        #editPreview::-webkit-scrollbar-track { background: transparent; }
        #editPreview::-webkit-scrollbar-thumb { background: #dbe2ea; border-radius: 999px; }
    </style>
</head>
<body class="flex flex-col antialiased selection:bg-brand-500 selection:text-white relative">

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 max-w-[92vw] bg-slate-900/95 text-white px-4 py-2.5 rounded-xl shadow-2xl text-[13px] font-medium z-[200] transition-all duration-300 transform translate-y-12 opacity-0 pointer-events-none flex items-center space-x-2">
        <i id="toastIcon" class="ri-checkbox-circle-line text-emerald-400 text-sm flex-shrink-0"></i>
        <span id="toastText" class="min-w-0 break-words leading-snug">提示信息</span>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 w-screen h-screen z-[160] flex items-center justify-center overflow-hidden bg-slate-950">
        <div id="loadingDecor" class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-40 -left-32 w-[28rem] h-[28rem] bg-blue-600/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -right-32 w-[28rem] h-[28rem] bg-cyan-500/20 rounded-full blur-3xl"></div>
            <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[36rem] h-[36rem] bg-indigo-600/10 rounded-full blur-3xl"></div>
        </div>
        <div class="relative bg-white px-6 py-4 rounded-2xl shadow-xl flex flex-col max-w-[320px]">
            <div class="flex items-center space-x-3">
                <div class="w-6 h-6 border-[3px] border-brand-600 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
                <span id="loadingText" class="text-[13px] font-medium text-slate-700">正在加载知识库...</span>
            </div>
            <div id="loadingProgressWrap" class="hidden w-[220px] max-w-[70vw] mt-3">
                <div class="h-1.5 w-full bg-slate-200/80 rounded-full overflow-hidden">
                    <div id="loadingProgressBar" class="h-full bg-brand-500 rounded-full transition-[width] duration-200" style="width:0%"></div>
                </div>
                <div class="mt-1.5 flex items-center justify-between gap-3 text-[11px] text-slate-500">
                    <span id="loadingProgressStage" class="truncate">正在处理...</span>
                    <span id="loadingProgressPercent" class="tabular-nums flex-shrink-0">0%</span>
                </div>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="fixed inset-0 z-[170] flex items-center justify-center p-4 hidden">
        <div id="confirmModalOverlay" class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm"></div>
        <div class="confirm-card relative w-full max-w-[340px] bg-white rounded-2xl shadow-2xl px-6 pt-7 pb-6">
            <div class="flex justify-center mb-4">
                <div id="confirmIconWrap" class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center">
                    <i id="confirmIcon" class="ri-delete-bin-line text-2xl text-red-500"></i>
                </div>
            </div>
            <h3 id="confirmTitle" class="text-base font-bold text-slate-900 text-center leading-snug">确认操作</h3>
            <p id="confirmDesc" class="text-[13px] text-slate-500 leading-relaxed text-center mt-2 mb-6 px-1"></p>
            <div class="flex items-center gap-2.5">
                <button id="confirmCancelBtn" type="button" class="flex-1 py-2.5 text-[13px] font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 active:bg-slate-200 rounded-xl transition">取消</button>
                <button id="confirmOkBtn" type="button" class="flex-1 py-2.5 text-[13px] font-medium text-white bg-red-500 hover:bg-red-600 active:bg-red-600 rounded-xl shadow-sm transition">确定</button>
            </div>
        </div>
    </div>

    <!-- 登录页 -->
    <div id="authOverlay" class="fixed inset-0 w-screen h-screen z-[150] bg-slate-950 overflow-y-auto hidden">
        <div class="fixed inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-0 left-1/4 -translate-x-1/2 w-[44rem] h-[44rem] -translate-y-1/2 bg-blue-500/[0.10] rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 right-0 w-[32rem] h-[32rem] translate-x-1/4 translate-y-1/4 bg-cyan-500/[0.07] rounded-full blur-3xl"></div>
        </div>
        <!-- 左上角品牌：与应用顶栏一致 -->
        <div class="absolute top-0 left-0 h-14 flex items-center px-4 sm:px-6 z-20">
            <div class="flex items-end space-x-1.5 -translate-y-[3px]">
                <svg class="w-8 h-8 flex-shrink-0 -mb-[3px]" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="login-logo-g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00c6ff"/><stop offset="100%" stop-color="#0072ff"/></linearGradient>
                        <linearGradient id="login-logo-g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0052d4"/><stop offset="100%" stop-color="#4364f7"/></linearGradient>
                        <linearGradient id="login-logo-g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00c6ff"/><stop offset="50%" stop-color="#0072ff"/><stop offset="100%" stop-color="#0052d4"/></linearGradient>
                    </defs>
                    <g>
                        <path d="M256,100 C370,100 440,180 440,290 C440,390 350,450 256,450 C160,450 70,370 70,260 C70,160 160,100 256,100 Z" fill="url(#login-logo-g2)"/>
                        <path d="M120,280 C120,170 200,110 310,110 C390,110 430,170 420,250 C410,330 310,400 210,400 C140,400 120,340 120,280 Z" fill="url(#login-logo-g1)" opacity="0.9"/>
                        <path d="M256,110 C330,110 390,160 390,230 C390,320 290,380 200,350 C260,330 320,280 320,220 C320,160 270,120 256,110 Z" fill="url(#login-logo-g3)"/>
                        <path d="M235 240 C220 230 200 220 185 240 C170 260 185 285 205 280 C225 275 235 255 235 240 Z M277 240 C292 230 312 220 327 240 C342 260 327 285 307 280 C287 275 277 255 277 240 Z M256 265 C240 280 235 305 256 320 C277 305 272 280 256 265 Z" fill="#ffffff"/>
                    </g>
                </svg>
                <span class="brand-title text-base text-white whitespace-nowrap">椿沐智库</span>
            </div>
        </div>

        <!-- 居中登录卡片 -->
        <div class="relative z-10 min-h-full flex items-center justify-center px-6 py-24">
            <div class="w-full max-w-[380px]">
                <div class="rounded-2xl border border-white/10 bg-white/[0.055] backdrop-blur-xl p-8 shadow-2xl shadow-black/40">
                    <div class="mb-6">
                        <h1 class="text-[18px] font-semibold text-white">登录到智库</h1>
                    </div>
                    <form id="authForm" class="space-y-5" autocomplete="off">

                            <label for="authTokInput" class="block mb-1 text-[12px] font-medium text-slate-300">访问令牌</label>

    <script>
        /* ==================== 内存缓存（LRU，防止无上限增长） ==================== */
        class SimpleLRU {
            constructor(limit) { this.limit = limit; this.map = new Map(); }
            get(key) {
                if (!this.map.has(key)) return undefined;
                const value = this.map.get(key);
                this.map.delete(key);
                this.map.set(key, value);
                return value;
            }
            has(key) { return this.map.has(key); }
            set(key, value) {
                if (this.map.has(key)) this.map.delete(key);
                this.map.set(key, value);
                while (this.map.size > this.limit) {
                    const oldest = this.map.keys().next().value;
                    this.map.delete(oldest);
                }
            }
            delete(key) { this.map.delete(key); }
            clear() { this.map.clear(); }
        }

        let docs = [];
        // 正文缓存最多保留 25 篇；图片 JSON（base64）最多保留 30 张
        const docContentCache = new SimpleLRU(25);
        const imageJsonCache = new SimpleLRU(30);
        let currentDocId = null;
        let previousDocId = null;
        let activeCategory = 'ALL';
        let activeTag = null;
        let searchQuery = '';
        let isEditing = false;
        let isLoggingIn = false;
        let isManualSyncing = false;
        let githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' };
        let editAttachments = [];
        // 本次编辑会话中已上传到 GitHub、但尚未保存的文件（取消时需清理）
        let pendingUploads = [];
        // 本次编辑会话中移除的原有附件（保存时才真正删除，取消则保留）
        let pendingDeletedAttachments = [];
        // 编辑会话标识：取消/保存后递增，用于丢弃迟到的上传结果，避免产生孤儿文件
        let editSessionId = 0;
        let isPreviewMode = false;
        let isSavingDoc = false;
        let searchDebounceTimer = null;
        // Git Data API 使用的默认分支缓存（切换仓库时重置）
        let repoDefaultBranch = '';

        const DEFAULT_LOADING_TEXT = '正在加载知识库...';
        // 记住最后打开的文档，刷新后自动恢复
        const LAST_DOC_KEY = 'kb_last_doc_id';
        const MAX_ATTACHMENT_SIZE = 20 * 1024 * 1024;
        // 10MB 以内优先走 Contents API（单请求）；更大的文件走 Git Data API
        const CONTENTS_UPLOAD_LIMIT = 10 * 1024 * 1024;
        // 超过 2MB 的附件按 1.5MB 分片上传，规避单次请求体过大导致的网络中断
        const CHUNKED_UPLOAD_THRESHOLD = 2 * 1024 * 1024;
        const CHUNK_SIZE = 1.5 * 1024 * 1024;
        const DOWNLOAD_REVOKE_DELAY = 60000;
        const DOCS_FOLDER = 'docs';
        const ATTACHMENT_FOLDERS = { table: '表格', word: 'Word', ppt: 'PPT', pdf: 'PDF', archive: '压缩包', other: '其他' };

        /* ==================== 列表卡片辅助 ==================== */
        // 今天/昨天优先，其次当年只显示 MM-DD，更省空间也更易读
        function formatDocDate(value) {
            if (!value) return '';
            const raw = String(value);
            const m = raw.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})/);
            if (!m) return raw.split(' ')[0];
            const now = new Date();
            const target = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.round((today - target) / 86400000);
            if (diffDays === 0) return '今天';
            if (diffDays === 1) return '昨天';
            if (target.getFullYear() === now.getFullYear()) return `${Number(m[2])}-${Number(m[3])}`;
            return `${m[1]}/${Number(m[2])}/${Number(m[3])}`;
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        /* ==================== UTF-8 Base64（替代 unescape 方案） ==================== */
        function utf8ToBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            const CHUNK = 0x8000;
            for (let i = 0; i < bytes.length; i += CHUNK) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
            }
            return btoa(binary);
        }

        function base64ToUtf8(b64) {
            const binary = atob(String(b64 || '').replace(/\s/g, ''));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        /* ==================== Markdown 安全渲染 ==================== */
        // 优先使用 DOMPurify；CDN 未加载时退回到基于惰性文档的保守清洗
        function sanitizeHtml(html) {
            if (window.DOMPurify && typeof window.DOMPurify.sanitize === 'function') {
                return window.DOMPurify.sanitize(html, {
                    USE_PROFILES: { html: true },
                    ADD_ATTR: ['target', 'rel']
                });
            }
            const parsed = new DOMParser().parseFromString(String(html || ''), 'text/html');
            parsed.querySelectorAll('script,iframe,frame,object,embed,link,style,meta,form,base').forEach(n => n.remove());
            parsed.querySelectorAll('*').forEach(el => {
                for (const attr of Array.from(el.attributes)) {
                    const name = attr.name.toLowerCase();
                    const value = (attr.value || '').trim();
                    if (name.startsWith('on')) { el.removeAttribute(attr.name); continue; }
                    if ((name === 'href' || name === 'src' || name === 'xlink:href' || name === 'action') &&
                        /^(javascript|vbscript|data:text\/html)/i.test(value)) {
                        el.removeAttribute(attr.name);
                    }
                }
            });
            return parsed.body.innerHTML;
        }

        // 图片加载：先在骨架屏里等待数据，拿到后再赋 src，避免浏览器渲染原生“破图”占位
        async function loadImageIntoFrame(img, src, frame) {
            frame.classList.remove('is-error', 'is-ready');
            frame.classList.add('is-loading');
            frame.onclick = null;

            let dataUrl = imageJsonCache.get(src) || null;
            if (!dataUrl) {
                try { dataUrl = await fetchImageJsonFromGithub(src); } catch (e) { dataUrl = null; }
            }
            if (!dataUrl) {
                img.removeAttribute('src');
                frame.classList.remove('is-loading');
                frame.classList.add('is-error');
                frame.onclick = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    loadImageIntoFrame(img, src, frame);
                };
                return false;
            }
            imageJsonCache.set(src, dataUrl);

            const loaded = await new Promise((resolve) => {
                const finish = (ok) => { img.onload = null; img.onerror = null; resolve(ok); };
                img.onload = () => finish(true);
                img.onerror = () => finish(false);
                img.src = dataUrl;
                if (img.complete && img.naturalWidth > 0) finish(true);
            });

            if (!loaded) {
                img.removeAttribute('src');
                frame.classList.remove('is-loading');
                frame.classList.add('is-error');
                frame.onclick = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    imageJsonCache.delete(src);
                    loadImageIntoFrame(img, src, frame);
                };
                return false;
            }
            frame.classList.remove('is-loading');
            frame.classList.add('is-ready');
            img.onclick = () => openGalleryFromImage(img);
            return true;
        }

        async function renderMarkdownInto(container, content) {
            // 先在离屏节点里解析并挂好加载态，再整体搬进页面：
            // 这样浏览器始终看不到 "images/*.json" 这种无效 src，不会出现原生破图
            const staging = document.createElement('div');
            staging.innerHTML = sanitizeHtml(marked.parse(content || ''));
            const tasks = [];
            staging.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src') || '';
                if (!src.startsWith('images/') || !src.endsWith('.json')) return;

                const frame = document.createElement('span');
                frame.className = 'md-img-frame is-loading';
                const spinner = document.createElement('span');
                spinner.className = 'md-img-spinner';
                const errBox = document.createElement('span');
                errBox.className = 'md-img-error';
                errBox.innerHTML = '<i class="ri-image-2-line"></i><span>图片加载失败，点击重试</span>';
                frame.appendChild(spinner);
                frame.appendChild(errBox);

                // 关键：先把无效的 json 路径从 src 上摘掉，浏览器就不会画破图
                img.removeAttribute('src');
                img.classList.add('md-img');

                const parent = img.parentNode;
                if (!parent) return;
                parent.insertBefore(frame, img);
                frame.appendChild(img);
                tasks.push(loadImageIntoFrame(img, src, frame));
            });
            await Promise.all(tasks);

            // 外部图片（非 images/*.json）保持原有行为
            staging.querySelectorAll('img:not(.md-img)').forEach(imgEl => {
                imgEl.onclick = () => openGalleryFromImage(imgEl);
            });

            container.replaceChildren(...Array.from(staging.childNodes));
        }

        function clearAllCaches() {
            docContentCache.clear();
            imageJsonCache.clear();
        }

        /* ==================== 搜索框 placeholder 自适应 ==================== */
        function updateSearchPlaceholder() {
            const input = document.getElementById('searchInput');
            if (!input) return;
            input.placeholder = window.innerWidth < 640 ? '搜索…' : '搜索标题、摘要、编码或标签...';
        }

        /* ==================== IndexedDB ==================== */
        const IDB_NAME = 'chunmu_kb';
        const IDB_VERSION = 1;
        const IDB_STORE = 'cache';
        let _idbPromise = null;

        function openIDB() {
            if (_idbPromise) return _idbPromise;
            _idbPromise = new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) { reject(new Error('当前浏览器不支持 IndexedDB')); return; }
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return _idbPromise;
        }

        async function idbGet(key) {
            try {
                const db = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readonly');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { console.warn('IndexedDB 读取失败', e); return undefined; }
        }

        async function idbSet(key, value) {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                const store = tx.objectStore(IDB_STORE);
                const req = store.put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function idbDel(key) {
            try {
                const db = await openIDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.delete(key);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { console.warn('IndexedDB 删除失败', e); }
        }

        /* ==================== 虚拟列表（节点池复用） ==================== */
        // 行高固定为 116px（标题 + 两行摘要 + 元信息行，均为定高），
        // 虚拟列表的定位、spacer 高度与回收计算全部依赖这个常量
        const virtualList = { container: null, spacer: null, items: [], itemHeight: 116, buffer: 10, rafPending: false, nodes: new Map() };

        function initVirtualList() {
            const container = document.getElementById('docList');
            if (!container) return;
            container.innerHTML = '';
            container.style.position = 'relative';
            container.style.overflowY = 'auto';
            container.style.overflowX = 'hidden';
            container.style.background = '#f5f7fa';
            const spacer = document.createElement('div');
            spacer.style.position = 'relative';
            spacer.style.width = '100%';
            spacer.style.height = '0px';
            container.appendChild(spacer);
            virtualList.container = container;
            virtualList.spacer = spacer;
            virtualList.nodes.clear();
            container.addEventListener('scroll', () => {
                if (virtualList.rafPending) return;
                virtualList.rafPending = true;
                requestAnimationFrame(() => {
                    virtualList.rafPending = false;
                    renderVirtualItems();
                });
            }, { passive: true });
            container.addEventListener('touchend', () => {
                if (virtualList.rafPending) return;
                virtualList.rafPending = true;
                requestAnimationFrame(() => {
                    virtualList.rafPending = false;
                    renderVirtualItems();
                });
            }, { passive: true });
            window.addEventListener('resize', () => renderVirtualItems());
        }

        function createDocListItem(d) {
            const wrapper = document.createElement('div');
            const isSelected = currentDocId === d.id;
            wrapper.style.cssText = `position:absolute; left:0; right:0; height:${virtualList.itemHeight}px; padding:6px 10px; box-sizing:border-box;`;
            wrapper.dataset.docId = d.id;

            const catName = d.category || '通用';
            const attCount = (d.attachments || []).length;
            const dateStr = formatDocDate(d.updatedAt);

            const summaryText = escapeHtml((d.summary || '').replace(/[#*`!]/g, '').trim());
            const summaryHtml = summaryText || '<span class="text-slate-300">暂无摘要</span>';

            wrapper.innerHTML = `
                <div class="doc-card relative h-full rounded-[14px] overflow-hidden cursor-pointer ${isSelected ? 'is-selected' : ''}">
                    ${isSelected ? '<span class="absolute left-0 top-3.5 bottom-3.5 w-[3px] rounded-full bg-brand-500"></span>' : ''}
                    <div class="h-full flex flex-col justify-center px-3.5">
                        <div class="flex items-center justify-between gap-2">
                            <h4 class="flex-1 min-w-0 text-[14.5px] font-semibold leading-[20px] tracking-[-0.01em] truncate ${isSelected ? 'text-brand-700' : 'text-slate-800'}">${escapeHtml(d.title || '无标题')}</h4>
                            <span class="flex-shrink-0 text-[11px] leading-none tabular-nums ${isSelected ? 'text-brand-400' : 'text-slate-400'}">${dateStr}</span>
                        </div>
                        <p class="mt-1.5 text-[12.5px] leading-[18px] text-slate-500 line-clamp-2 h-[36px] overflow-hidden">${summaryHtml}</p>
                        <div class="mt-2 h-[18px] flex items-center gap-1.5 overflow-hidden">
                            <span class="inline-block px-2 py-[1px] rounded-md bg-slate-100 text-slate-600 text-[12px] font-medium leading-[16px] truncate max-w-[120px] flex-shrink">${escapeHtml(catName)}</span>
                            ${d.code ? `<span class="inline-block px-2 py-[1px] rounded-md bg-slate-100 text-slate-500 text-[12px] font-mono leading-[16px] tracking-tight flex-shrink-0">${escapeHtml(d.code)}</span>` : ''}
                            <span class="flex-1"></span>
                            ${attCount > 0 ? `<span class="inline-flex items-center gap-0.5 text-[12px] text-slate-400 leading-none flex-shrink-0"><i class="ri-attachment-2 text-[13px]"></i>${attCount}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
            wrapper.onclick = async () => {
                // 编辑中直接切换文档等同于放弃编辑：先清理本次会话未保存的上传
                if (isEditing) {
                    await discardEditSessionUploads(true);
                    editAttachments = [];
                    isEditing = false;
                }
                openDocView(d.id);
            };
            return wrapper;
        }

        function renderVirtualItems() {
            const { container, spacer, items, itemHeight, buffer, nodes } = virtualList;
            if (!container || !spacer) return;
            const totalHeight = items.length * itemHeight;
            spacer.style.height = totalHeight + 'px';

            if (items.length === 0) {
                nodes.forEach(node => { try { if (node.parentNode) node.parentNode.removeChild(node); } catch (e) {} });
                nodes.clear();
                if (!spacer.querySelector('[data-virtual-empty]')) {
                    const empty = document.createElement('div');
                    empty.setAttribute('data-virtual-empty', '1');
                    empty.className = 'flex flex-col items-center justify-center py-20 px-6 text-center';
                    empty.innerHTML = `<i class="ri-inbox-line text-3xl text-slate-300 mb-2.5"></i><p class="text-[13px] text-slate-400">${searchQuery ? '没有匹配的条目' : '暂无条目'}</p>`;
                    spacer.appendChild(empty);
                }
                return;
            }

            const emptyEl = spacer.querySelector('[data-virtual-empty]');
            if (emptyEl) emptyEl.remove();

            const scrollTop = container.scrollTop;
            const viewportHeight = container.clientHeight || Math.max(600, window.innerHeight);
            const startIndex = Math.max(0, Math.floor(scrollTop / itemHeight) - buffer);
            const endIndex = Math.min(items.length, Math.ceil((scrollTop + viewportHeight) / itemHeight) + buffer);

            nodes.forEach((node, index) => {
                if (index < startIndex || index >= endIndex) {
                    try { if (node.parentNode) node.parentNode.removeChild(node); } catch (e) {}
                    nodes.delete(index);
                }
            });

            let fragment = null;
            for (let i = startIndex; i < endIndex; i++) {
                if (nodes.has(i)) continue;
                const d = items[i];
                const el = createDocListItem(d);
                el.style.position = 'absolute';
                el.style.top = (i * itemHeight) + 'px';
                el.style.left = '0';
                el.style.right = '0';
                nodes.set(i, el);
                if (!fragment) fragment = document.createDocumentFragment();
                fragment.appendChild(el);
            }
            if (fragment) spacer.appendChild(fragment);
        }

        function renderVirtualList(list) {
            virtualList.items = list || [];
            if (virtualList.spacer) virtualList.spacer.innerHTML = '';
            virtualList.nodes.clear();
            renderVirtualItems();
        }

        /* ==================== 工具 ==================== */
        function encodeRepoPath(path) { return path.split('/').map(encodeURIComponent).join('/'); }

        function makeSummary(content, maxLen = 150) {
            if (!content) return '';
            let text = content
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`([^`]*)`/g, '$1')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/[*_~]/g, '')
                .replace(/^>\s?/gm, '')
                .replace(/^[-*+]\s+/gm, '')
                .replace(/^\d+\.\s+/gm, '')
                .replace(/\s+/g, ' ')
                .trim();
            if (text.length > maxLen) text = text.slice(0, maxLen) + '...';
            return text;
        }

        function dataURLtoBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const header = parts[0] || '';
            const base64 = parts[1] || '';
            const mimeMatch = header.match(/:(.*?);/);
            const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
            const binary = atob(base64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        function convertDataUrlToBlobType(dataUrl, targetMime) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth || img.width;
                        canvas.height = img.naturalHeight || img.height;
                        const ctx = canvas.getContext('2d');
                        if (targetMime === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
                        ctx.drawImage(img, 0, 0);
                        canvas.toBlob((blob) => {
                            if (blob && blob.size > 0) resolve(blob);
                            else reject(new Error('图片转换失败'));
                        }, targetMime, targetMime === 'image/jpeg' ? 0.92 : undefined);
                    } catch (e) { reject(new Error('图片转换失败')); }
                };
                img.onerror = () => reject(new Error('图片加载失败'));
                img.src = dataUrl;
            });
        }

        function triggerBlobDownload(filename, blob) {
            if (!blob || blob.size === 0) throw new Error('文件内容为空');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                try { if (a.parentNode) a.parentNode.removeChild(a); } catch (e) {}
                try { URL.revokeObjectURL(url); } catch (e) {}
            }, DOWNLOAD_REVOKE_DELAY);
        }

        async function prepareAndDownload(filename, getBlob) {
            showLoading('正在准备下载...');
            try {
                const blob = await getBlob();
                if (!blob || blob.size === 0) throw new Error('文件内容为空');
                triggerBlobDownload(filename, blob);
                hideLoading();
                showToast('下载已开始，请到浏览器下载列表查看', 'success');
            } catch (e) {
                hideLoading();
                showToast('下载失败：' + (e.message || '未知错误'), 'error');
            }
        }

        function guessMimeByName(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            const map = { pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json',zip:'application/zip',rar:'application/vnd.rar','7z':'application/x-7z-compressed',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml' };
            return map[ext] || 'application/octet-stream';
        }

        /* ==================== GitHub 文件读写 ==================== */
        async function githubApi(path, options = {}) {
            const headers = {
                'Authorization': `Bearer ${githubConfig.token}`,
                'Accept': 'application/vnd.github+json',
                ...(options.body ? { 'Content-Type': 'application/json' } : {}),
                ...(options.headers || {})
            };
            return fetch(`https://api.github.com${path}`, { ...options, headers });
        }

        // 把 GitHub 返回的 message 一并带出，失败时用户能知道具体原因
        async function githubErrorText(res, fallback) {
            let msg = `${fallback} (${res.status})`;
            try {
                const data = await res.json();
                if (data && data.message) msg += '：' + data.message;
            } catch (e) {}
            return msg;
        }

        async function getRepoDefaultBranch() {
            if (repoDefaultBranch) return repoDefaultBranch;
            const res = await githubApi(`/repos/${githubConfig.repo}`);
            if (!res.ok) throw new Error(await githubErrorText(res, '获取仓库信息失败'));
            const data = await res.json();
            repoDefaultBranch = data.default_branch || 'main';
            return repoDefaultBranch;
        }

        // 用 XHR 发送 JSON 请求，才能拿到真实的上传进度（fetch 不提供上传进度）
        function xhrJsonRequest(method, url, payload, onProgress, errorLabel) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open(method, url);
                xhr.setRequestHeader('Authorization', `Bearer ${githubConfig.token}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github+json');
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.upload.onprogress = (e) => {
                    if (onProgress && e.lengthComputable && e.total > 0) onProgress(e.loaded / e.total);
                };
                xhr.onerror = () => reject(new Error(`${errorLabel || '请求'}失败：网络异常，上传中断`));
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try { resolve(xhr.responseText ? JSON.parse(xhr.responseText) : {}); }
                        catch (e) { resolve({}); }
                    } else {
                        let msg = `${errorLabel || '请求'}失败 (${xhr.status})`;
                        try {
                            const j = JSON.parse(xhr.responseText);
                            if (j && j.message) msg += '：' + j.message;
                        } catch (e) {}
                        reject(new Error(msg));
                    }
                };
                xhr.send(JSON.stringify(payload));
            });
        }

        // 大附件走 Git Data API（blobs + trees + commits），避免 Contents API 的大小限制
        function createGithubBlobWithProgress(base64Content, onProgress) {
            return xhrJsonRequest('POST', `https://api.github.com/repos/${githubConfig.repo}/git/blobs`,
                { content: base64Content, encoding: 'base64' }, onProgress, '创建 blob ');
        }

        // 10MB 以内的附件直接走 Contents API：单次请求、链路更短，比多步 Git Data 更稳
        async function uploadAttachmentViaContents(path, base64Content, message, onProgress) {
            const apiPath = encodeRepoPath(path);
            const url = `https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`;
            let sha = '';
            try {
                const check = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${githubConfig.token}`, 'Accept': 'application/vnd.github+json' }
                });
                if (check.ok) {
                    const data = await check.json();
                    sha = data.sha || '';
                }
            } catch (e) {}
            const payload = { message, content: base64Content };
            if (sha) payload.sha = sha;
            await xhrJsonRequest('PUT', url, payload, onProgress, '上传附件');
        }

        async function uploadAttachmentViaGitData(path, base64Content, message, onProgress = null, onStage = null) {
            if (!githubConfig.token || !githubConfig.repo) throw new Error('未配置仓库');
            const repo = githubConfig.repo;
            const branch = await getRepoDefaultBranch();
            const encodedBranch = branch.split('/').map(encodeURIComponent).join('/');

            // 先传 blob，再读取分支头并提交：大文件上传耗时长，这样能降低提交时分支已变化的概率
            const blob = await createGithubBlobWithProgress(base64Content, onProgress);
            if (onStage) onStage('write');

            // 分支冲突时只重做 tree/commit/ref，不重复上传大文件
            for (let attempt = 0; attempt <= 2; attempt++) {
                const refRes = await githubApi(`/repos/${repo}/git/ref/heads/${encodedBranch}`);
                if (!refRes.ok) throw new Error(await githubErrorText(refRes, '获取分支引用失败'));
                const parentSha = (await refRes.json()).object.sha;

                const commitRes = await githubApi(`/repos/${repo}/git/commits/${parentSha}`);
                if (!commitRes.ok) throw new Error(await githubErrorText(commitRes, '获取父提交失败'));
                const parentCommit = await commitRes.json();

                const treeRes = await githubApi(`/repos/${repo}/git/trees`, {
                    method: 'POST',
                    body: JSON.stringify({
                        base_tree: parentCommit.tree.sha,
                        tree: [{ path, mode: '100644', type: 'blob', sha: blob.sha }]
                    })
                });
                if (!treeRes.ok) throw new Error(await githubErrorText(treeRes, '创建 tree 失败'));
                const tree = await treeRes.json();

                const newCommitRes = await githubApi(`/repos/${repo}/git/commits`, {
                    method: 'POST',
                    body: JSON.stringify({ message, tree: tree.sha, parents: [parentSha] })
                });
                if (!newCommitRes.ok) throw new Error(await githubErrorText(newCommitRes, '创建提交失败'));
                const newCommit = await newCommitRes.json();

                const updateRes = await githubApi(`/repos/${repo}/git/refs/heads/${encodedBranch}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ sha: newCommit.sha, force: false })
                });
                if (updateRes.ok) return true;
                if ((updateRes.status === 409 || updateRes.status === 422) && attempt < 2) {
                    await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
                    continue;
                }
                throw new Error(await githubErrorText(updateRes, '更新分支失败'));
            }
            throw new Error('更新分支失败：多次重试仍未成功');
        }

        // XHR 下载可以拿到 onprogress，用来显示真实的下载进度
        function fetchGithubFileRawWithProgress(path, onProgress) {
            return new Promise((resolve, reject) => {
                if (!githubConfig.token || !githubConfig.repo) { reject(new Error('未配置仓库')); return; }
                const apiPath = encodeRepoPath(path);
                const xhr = new XMLHttpRequest();
                xhr.open('GET', `https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`);
                xhr.setRequestHeader('Authorization', `Bearer ${githubConfig.token}`);
                xhr.setRequestHeader('Accept', 'application/vnd.github.v3.raw');
                xhr.responseType = 'blob';
                xhr.onprogress = (e) => {
                    if (onProgress && e.lengthComputable && e.total > 0) onProgress(e.loaded / e.total);
                };
                xhr.onerror = () => reject(new Error('网络异常，下载中断'));
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const blob = xhr.response;
                        if (!blob || blob.size === 0) { reject(new Error('文件内容为空')); return; }
                        resolve(blob);
                        return;
                    }
                    const fallback = `获取文件失败 (${xhr.status})`;
                    const blob = xhr.response;
                    if (blob && typeof blob.text === 'function') {
                        blob.text().then(text => {
                            let msg = fallback;
                            try { const j = JSON.parse(text); if (j && j.message) msg += '：' + j.message; } catch (e) {}
                            reject(new Error(msg));
                        }).catch(() => reject(new Error(fallback)));
                    } else {
                        reject(new Error(fallback));
                    }
                };
                xhr.send();
            });
        }

        async function fetchGithubJSONWithMeta(path) {
            if (!githubConfig.token || !githubConfig.repo) throw new Error('未配置仓库');
            const apiPath = encodeRepoPath(path);
            const metaRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                headers: { 'Authorization': `Bearer ${githubConfig.token}` }
            });
            if (!metaRes.ok) {
                const err = new Error(`获取元数据失败 (${metaRes.status})`);
                err.status = metaRes.status;
                throw err;
            }
            const meta = await metaRes.json();
            const sha = meta.sha;
            let text;
            if (meta.content && meta.encoding === 'base64') {
                text = base64ToUtf8(meta.content);
            } else {
                const rawRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                    headers: { 'Authorization': `Bearer ${githubConfig.token}`, 'Accept': 'application/vnd.github.v3.raw' }
                });
                if (!rawRes.ok) throw new Error(`获取内容失败 (${rawRes.status})`);
                text = await rawRes.text();
            }
            return { sha, text };
        }

        async function fetchImageJsonFromGithub(path) {

                const metaRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {

                });
                if (!metaRes.ok) return null;

                let jsonStr = '';
                if (meta.content && meta.encoding === 'base64') {

        /* ==================== 文档正文 ==================== */
        async function uploadDocContent(id, content, meta = {}, retryCount = 0) {
            if (!githubConfig.token || !githubConfig.repo) throw new Error('未配置仓库');
            const path = `${DOCS_FOLDER}/${id}.json`;
            const apiPath = encodeRepoPath(path);
            const payload = { id, title: meta.title || '', content, updatedAt: meta.updatedAt || new Date().toLocaleString() };
            const contentEncoded = utf8ToBase64(JSON.stringify(payload));
            let sha = '';
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                    headers: { 'Authorization': `Bearer ${githubConfig.token}` }
                });
                if (checkRes.ok) { const checkData = await checkRes.json(); sha = checkData.sha; }
            } catch (e) {}
            const body = { message: `kb: update doc content ${id}`, content: contentEncoded };
            if (sha) body.sha = sha;
            const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${githubConfig.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) return true;
            if (res.status === 409 && retryCount < 1) {
                await new Promise(r => setTimeout(r, 300));
                return uploadDocContent(id, content, meta, retryCount + 1);
            }
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson.message || '上传正文失败');
        }

        async function fetchDocContent(id) {
            const cached = docContentCache.get(id);
            if (cached !== undefined) return cached;
            const obj = await fetchGithubJSONFile(`${DOCS_FOLDER}/${id}.json`);
            const content = obj.content || '';
            docContentCache.set(id, content);
            return content;
        }

        /* ==================== 主索引 ==================== */
        async function uploadMainIndex(indexDocs) {
            if (!githubConfig.token || !githubConfig.repo) return;
            updateSyncStatus('loading', '同步中');
            try {
                if (!githubConfig.sha) {
                    try {
                        const apiPath = encodeRepoPath(githubConfig.path);
                        const checkRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                            headers: { 'Authorization': `Bearer ${githubConfig.token}` }
                        });
                        if (checkRes.ok) { const checkData = await checkRes.json(); githubConfig.sha = checkData.sha; }
                    } catch (ex) {}
                }
                const contentEncoded = utf8ToBase64(JSON.stringify(indexDocs, null, 2));
                const body = { message: `kb: update index ${new Date().toLocaleString()}`, content: contentEncoded };
                if (githubConfig.sha) body.sha = githubConfig.sha;
                const apiPath = encodeRepoPath(githubConfig.path);
                const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${apiPath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${githubConfig.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    const data = await res.json();
                    githubConfig.sha = data.content.sha;
                    localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
                    updateSyncStatus('success', '已同步');
                    return true;
                } else {
                    const errJson = await res.json().catch(() => ({}));
                    if (res.status === 409 && githubConfig.sha) {
                        githubConfig.sha = '';
                        return uploadMainIndex(indexDocs);
                    }
                    updateSyncStatus('error', errJson.message || '推送失败');
                    throw new Error(errJson.message || '上传索引失败');
                }
            } catch (e) {
                updateSyncStatus('error', '推送失败');
                throw e;
            }
        }

        /* ==================== 附件工具 ==================== */
        function getAttachmentType(file) {
            const name = (file.name || '').toLowerCase();
            const mime = (file.type || '').toLowerCase();
            if (mime.startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp|svg)$/.test(name)) return 'image';
            if (/\.(xlsx?|csv|numbers|ods)$/.test(name)) return 'table';
            if (/\.(docx?|pages|rtf|odt)$/.test(name)) return 'word';
            if (/\.(pptx?|key|odp)$/.test(name)) return 'ppt';
            if (/\.pdf$/.test(name)) return 'pdf';
            if (/\.(zip|rar|7z|tar|gz|tgz)$/.test(name)) return 'archive';
            return 'other';
        }
        function getAttachIcon(type) {
            const map = { table:'ri-file-excel-2-line text-emerald-600',word:'ri-file-word-line text-blue-600',ppt:'ri-file-ppt-line text-orange-600',pdf:'ri-file-pdf-line text-red-600',archive:'ri-file-zip-line text-purple-600',image:'ri-image-line text-pink-600',other:'ri-file-line text-slate-600' };
            return map[type] || map.other;
        }
        function getAttachIconBg(type) {
            const map = { table:'bg-emerald-50',word:'bg-blue-50',ppt:'bg-orange-50',pdf:'bg-red-50',archive:'bg-purple-50',image:'bg-pink-50',other:'bg-slate-100' };
            return map[type] || map.other;
        }
        function formatSize(bytes) {
            const n = Number(bytes) || 0;
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
            return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }
        function sanitizeFileName(name) {
            return (name || 'file').replace(/[<>:"/\\|?*\x00-\x1f]/g, '_').slice(0, 100);
        }
        function fileToBase64(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onprogress = (e) => {
                    if (onProgress && e.lengthComputable && e.total > 0) onProgress(e.loaded / e.total);
                };
                reader.onload = () => {
                    const result = reader.result || '';
                    const idx = result.indexOf(',');
                    resolve(idx >= 0 ? result.slice(idx + 1) : '');
                };
                reader.onerror = () => reject(reader.error || new Error('文件读取失败'));
                reader.readAsDataURL(file);
            });
        }

        /* ==================== 确认弹窗 ==================== */
        let confirmResolve = null;
        function showConfirm(options = {}) {
            const { title = '确认操作', desc = '', okText = '确定', cancelText = '取消', type = 'danger' } = options;
            return new Promise((resolve) => {
                confirmResolve = resolve;
                const modal = document.getElementById('confirmModal');
                const iconWrap = document.getElementById('confirmIconWrap');
                const icon = document.getElementById('confirmIcon');
                const okBtn = document.getElementById('confirmOkBtn');
                const cancelBtn = document.getElementById('confirmCancelBtn');
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmDesc').textContent = desc;
                okBtn.textContent = okText;
                cancelBtn.textContent = cancelText;
                if (type === 'danger') {
                    iconWrap.className = 'w-14 h-14 rounded-full bg-red-50 flex items-center justify-center';
                    icon.className = 'ri-delete-bin-line text-2xl text-red-500';
                    okBtn.className = 'flex-1 py-2.5 text-[13px] font-medium text-white bg-red-500 hover:bg-red-600 active:bg-red-600 rounded-xl shadow-sm transition';
                } else {
                    iconWrap.className = 'w-14 h-14 rounded-full bg-amber-50 flex items-center justify-center';
                    icon.className = 'ri-error-warning-line text-2xl text-amber-500';
                    okBtn.className = 'flex-1 py-2.5 text-[13px] font-medium text-white bg-brand-600 hover:bg-brand-700 active:bg-brand-700 rounded-xl shadow-sm transition';
                }
                modal.classList.remove('hidden');
                setTimeout(() => { try { okBtn.focus(); } catch (e) {} }, 0);
            });
        }
        function closeConfirm(result) {
            const modal = document.getElementById('confirmModal');
            if (!modal || modal.classList.contains('hidden')) return;
            modal.classList.add('hidden');
            if (confirmResolve) {
                const r = confirmResolve;
                confirmResolve = null;
                r(result);
            }
        }
        function setupConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const overlay = document.getElementById('confirmModalOverlay');
            okBtn.addEventListener('click', () => closeConfirm(true));
            cancelBtn.addEventListener('click', () => closeConfirm(false));
            overlay.addEventListener('click', () => closeConfirm(false));
            document.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('hidden')) {
                    if (e.key === 'Escape') { e.preventDefault(); closeConfirm(false); }
                    else if (e.key === 'Enter') { e.preventDefault(); closeConfirm(true); }
                }
            });
        }

        // percent 传 null 收起进度条；stageText 显示当前阶段（如“正在上传 42%”）
        function setLoadingProgress(percent, stageText) {
            const wrap = document.getElementById('loadingProgressWrap');
            const bar = document.getElementById('loadingProgressBar');
            const stage = document.getElementById('loadingProgressStage');
            const pctEl = document.getElementById('loadingProgressPercent');
            if (!wrap || !bar) return;
            if (percent === null || percent === undefined) {
                wrap.classList.add('hidden');
                bar.style.width = '0%';
                if (pctEl) pctEl.textContent = '0%';
                return;
            }
            const p = Math.max(0, Math.min(100, Number(percent) || 0));
            wrap.classList.remove('hidden');
            bar.style.width = p.toFixed(1) + '%';
            if (stage) stage.textContent = stageText || '正在处理...';
            if (pctEl) pctEl.textContent = Math.round(p) + '%';
        }
