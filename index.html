    <!-- Marked.js Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- RemixIcon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* 彻底重置视口，消除所有右侧空白与滚动槽位偏移 */
        * { box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 12px 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); background: #f1f5f9; }

        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #64748b; margin: 1rem 0; }
    </style>
</head>
<body class="flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- 全局图片预加载全屏遮罩提示层 -->
    <div id="loadingOverlay" class="fixed inset-0 w-screen h-screen bg-slate-900/40 backdrop-blur-sm z-[80] flex items-center justify-center hidden">
        <div class="bg-white px-6 py-4 rounded-2xl shadow-xl flex items-center space-x-3">
            <i class="ri-loader-4-line animate-spin text-2xl text-brand-600"></i>
            <span class="text-xs font-medium text-slate-700">正在加载文章及高清图片...</span>
        </div>
    </div>

    <!-- 首次登录授权拦截层 (层级 z-[70]) -->
    <div id="authOverlay" class="fixed inset-0 w-screen h-screen bg-slate-900/60 backdrop-blur-md z-[70] flex items-center justify-center p-4">
        <script>
            (function() {
                try {
                    const saved = localStorage.getItem('kb_gh_config');
                    if (saved) {
                        const cfg = JSON.parse(saved);
                        if (cfg && cfg.token) {
                            document.getElementById('authOverlay').classList.add('hidden');
                        }
                    }
                } catch(e) {}
            })();
        </script>
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-8 shadow-2xl space-y-6">
            <div class="flex items-center space-x-3 pb-2 border-b border-slate-100">
                <!-- 登录界面 Logo SVG -->
                <svg class="w-9 h-9 flex-shrink-0" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="auth-g1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00c6ff"/>
                            <stop offset="100%" stop-color="#0072ff"/>
                        </linearGradient>
                        <linearGradient id="auth-g2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0052d4"/>
                            <stop offset="100%" stop-color="#4364f7"/>
                        </linearGradient>
                        <linearGradient id="auth-g3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00c6ff"/>
                            <stop offset="50%" stop-color="#0072ff"/>
                            <stop offset="100%" stop-color="#0052d4"/>
                        </linearGradient>
                    </defs>
                    <g>
                        <path d="M256,100 C370,100 440,180 440,290 C440,390 350,450 256,450 C160,450 70,370 70,260 C70,160 160,100 256,100 Z" fill="url(#auth-g2)"/>
                        <path d="M120,280 C120,170 200,110 310,110 C390,110 430,170 420,250 C410,330 310,400 210,400 C140,400 120,340 120,280 Z" fill="url(#auth-g1)" opacity="0.9"/>
                        <path d="M256,110 C330,110 390,160 390,230 C390,320 290,380 200,350 C260,330 320,280 320,220 C320,160 270,120 256,110 Z" fill="url(#auth-g3)"/>
                        <path d="M235 240 C220 230 200 220 185 240 C170 260 185 285 205 280 C225 275 235 255 235 240 Z M277 240 C292 230 312 220 327 240 C342 260 327 285 307 280 C287 275 277 255 277 240 Z M256 265 C240 280 235 305 256 320 C277 305 272 280 256 265 Z" fill="#ffffff"/>
                    </g>
                </svg>
                <h1 class="text-xl font-extrabold tracking-tight text-slate-900">椿沐智库</h1>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">请输入你的 GitHub Personal Access Token (PAT) 以安全连接云端知识库。</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">GitHub Token (PAT)</label>
                    <input type="password" id="authTokInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">仓库路径 (Owner/Repo)</label>
                    <input type="text" id="authRepoInput" value="XiandeShen/xiande-kb" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                </div>
            </div>
            <button id="authSubmitBtn" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                <span>进入知识库</span>
                <i class="ri-arrow-right-line"></i>
            </button>
        </div>
    </div>

    <!-- 全局全屏抽屉遮罩 (层级 z-40) -->
    <div id="sidebarOverlay" class="fixed inset-0 w-screen h-screen bg-slate-900/40 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity"></div>

    <!-- Top Header (PC满宽贴边，移动端正确隐藏品牌文字) -->
    <header class="h-14 w-screen bg-slate-900 border-b border-slate-800 flex-shrink-0 flex items-center justify-between px-3 sm:px-6 z-30 shadow-md">
        <div class="flex items-center space-x-2 flex-shrink-0">
            <button id="mobileMenuBtn" class="lg:hidden p-1.5 text-slate-300 hover:text-white focus:outline-none rounded-lg hover:bg-slate-800 transition">
                <i class="ri-menu-line text-xl"></i>
            </button>
            <div class="hidden lg:flex items-center space-x-2.5">
                <!-- 主界面 Header Logo SVG -->
                <svg class="w-7 h-7 flex-shrink-0" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="header-g1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00c6ff"/>
                            <stop offset="100%" stop-color="#0072ff"/>
                        </linearGradient>
                        <linearGradient id="header-g2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0052d4"/>
                            <stop offset="100%" stop-color="#4364f7"/>
                        </linearGradient>
                        <linearGradient id="header-g3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00c6ff"/>
                            <stop offset="50%" stop-color="#0072ff"/>
                            <stop offset="100%" stop-color="#0052d4"/>
                        </linearGradient>
                    </defs>
                    <g>
                        <path d="M256,100 C370,100 440,180 440,290 C440,390 350,450 256,450 C160,450 70,370 70,260 C70,160 160,100 256,100 Z" fill="url(#header-g2)"/>
                        <path d="M120,280 C120,170 200,110 310,110 C390,110 430,170 420,250 C410,330 310,400 210,400 C140,400 120,340 120,280 Z" fill="url(#header-g1)" opacity="0.9"/>
                        <path d="M256,110 C330,110 390,160 390,230 C390,320 290,380 200,350 C260,330 320,280 320,220 C320,160 270,120 256,110 Z" fill="url(#header-g3)"/>
                        <path d="M235 240 C220 230 200 220 185 240 C170 260 185 285 205 280 C225 275 235 255 235 240 Z M277 240 C292 230 312 220 327 240 C342 260 327 285 307 280 C287 275 277 255 277 240 Z M256 265 C240 280 235 305 256 320 C277 305 272 280 256 265 Z" fill="#ffffff"/>
                    </g>
                </svg>
                <span class="font-extrabold text-base tracking-tight text-white whitespace-nowrap">椿沐智库</span>
            </div>
        </div>

        <!-- 全局统一搜索框 -->
        <div class="flex-1 max-w-xl mx-2 sm:mx-6">
            <div class="relative">
                <i class="ri-search-line absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="搜索标题、内容或标签..." 
                    class="w-full pl-10 pr-4 py-2 text-xs sm:text-sm rounded-full bg-slate-800/90 border border-slate-700/60 outline-none focus:outline-none focus:ring-2 focus:ring-brand-500 text-white placeholder-slate-400 transition shadow-inner">
            </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center space-x-1 sm:space-x-2 flex-shrink-0">
            <div class="hidden sm:block relative w-[85px] h-7">
                <div id="syncStatus" class="absolute right-0 top-0 flex items-center justify-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
                    <span class="w-2 h-2 rounded-full bg-slate-400 flex-shrink-0" id="syncDot"></span>
                    <span id="syncText" class="truncate">未连接</span>
                </div>
            </div>
            <button id="logoutBtn" title="解除绑定并退出" class="p-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-red-400 transition">
                <i class="ri-logout-box-r-line text-lg"></i>
            </button>
            <button id="githubConfigBtn" title="GitHub 绑定配置" class="p-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <i class="ri-github-fill text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative w-screen">

        <!-- Left Navigation Sidebar (层级 z-50) -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 flex flex-col flex-shrink-0 shadow-xl lg:shadow-none h-full">
            
            <!-- 导航与分类滚动区 -->
            <div class="p-4 space-y-6 overflow-y-auto flex-1">
                <div class="space-y-1">
                    <div class="px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">视图</div>
                    <button id="allDocsNavBtn" class="nav-filter-btn active w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium bg-brand-50 text-brand-600" data-category="ALL">
                        <span class="flex items-center space-x-2"><i class="ri-stack-line"></i><span>全部条目</span></span>
                        <span id="allCount" class="text-[11px] bg-brand-100 px-2 py-0.5 rounded-full">0</span>
                    </button>
                </div>

                <div class="space-y-1">
                    <div class="px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">分类</div>
                    <div id="categoryList" class="space-y-1"></div>
                </div>

                <div class="space-y-1">
                    <div class="px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">热门标签</div>
                    <div id="tagList" class="flex flex-wrap gap-1.5 px-1"></div>
                </div>
            </div>
        </aside>

        <!-- Document List Panel -->
        <div id="listPanel" class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 h-full relative">
            <div class="h-12 px-4 border-b border-slate-200 flex items-center justify-between text-xs text-slate-500 flex-shrink-0 bg-slate-50/50">
                <span id="listTitle" class="font-bold text-slate-700 truncate max-w-[200px]">所有条目</span>
                <span id="docCountText" class="text-slate-400 flex-shrink-0">0 个文档</span>
            </div>
            <div id="docList" class="flex-1 overflow-y-auto divide-y divide-slate-100 pb-20"></div>

            <!-- 中间栏底部悬浮胶囊浮岛操作栏 (小米/Apple 备忘录风格) -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20">
                <div class="bg-slate-900/90 backdrop-blur-md text-white px-4 py-2 rounded-full shadow-2xl border border-slate-700/60 flex items-center space-x-5">
                    <button id="manualSyncBtn" title="同步 GitHub 数据" class="flex items-center space-x-1 text-slate-300 hover:text-white transition text-xs font-medium">
                        <i class="ri-refresh-line text-base"></i>
                        <span></span>
                    </button>
                    <div class="w-[1px] h-3.5 bg-slate-700"></div>
                    <button id="newDocBtn" title="新建知识条目" class="flex items-center space-x-1 text-brand-400 hover:text-brand-300 transition text-xs font-bold">
                        <i class="ri-add-line text-base"></i>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Detail / Editor Main Panel -->
        <main id="mainPanel" class="hidden md:flex flex-1 bg-slate-50 flex-col overflow-hidden absolute md:relative inset-0 z-30 md:z-auto h-full w-full">

            <!-- Empty State -->
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 text-center overflow-y-auto">
                <i class="ri-draft-line text-6xl mb-4 opacity-40"></i>
                <p class="text-sm font-medium">选择左侧列表中的文章查看，或新建知识条目</p>
            </div>

            <!-- View Mode Panel -->
            <div id="viewPanel" class="hidden flex-1 flex flex-col overflow-hidden bg-white md:bg-transparent h-full">
                <div class="h-12 px-4 md:px-6 border-b border-slate-200 bg-white flex items-center justify-between flex-shrink-0 gap-2">
                    <div class="flex items-center space-x-2 min-w-0 flex-1">
                        <button id="backToListBtn" class="md:hidden p-1.5 text-slate-600 hover:bg-slate-100 rounded-lg flex items-center space-x-1 text-xs font-medium flex-shrink-0">
                            <i class="ri-arrow-left-line text-base"></i><span>返回</span>
                        </button>
                        <span id="viewCategoryBadge" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-brand-50 text-brand-600 truncate max-w-[140px] sm:max-w-xs flex-shrink-0">通用</span>
                    </div>
                    <div class="flex items-center space-x-2 flex-shrink-0">
                        <button id="editDocBtn" class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center space-x-1 transition">
                            <i class="ri-edit-line"></i><span>编辑</span>
                        </button>
                        <button id="deleteDocBtn" class="px-3 py-1.5 text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 rounded-xl flex items-center space-x-1 transition">
                            <i class="ri-delete-bin-line"></i><span>删除</span>
                        </button>
                    </div>
                </div>

                <!-- 独立滚动的文章正文区域 -->
                <div class="flex-1 overflow-y-auto p-4 md:p-10 w-full">
                    <div class="max-w-4xl mx-auto w-full">
                        <h1 id="viewTitle" class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-3"></h1>
                        <div class="flex flex-wrap items-center gap-3 text-xs text-slate-400 mb-6 pb-4 border-b border-slate-200">
                            <span id="viewDate"><i class="ri-time-line mr-1"></i>--</span>
                            <div id="viewTags" class="flex flex-wrap gap-1"></div>
                        </div>
                        <div id="viewContent" class="markdown-body text-slate-700"></div>
                    </div>
                </div>
            </div>

            <!-- Edit / Create Mode Panel -->
            <div id="editPanel" class="hidden flex-1 flex flex-col bg-white overflow-hidden h-full">
                <div class="h-12 px-4 md:px-6 border-b border-slate-200 flex items-center justify-between bg-slate-50 flex-shrink-0">
                    <div class="flex items-center space-x-2">
                        <button id="cancelEditBtn" class="md:hidden p-1.5 text-slate-600 hover:bg-slate-100 rounded-lg flex items-center space-x-1 text-xs font-medium">
                            <i class="ri-arrow-left-line text-base"></i><span>返回</span>
                        </button>
                        <span id="editorModeTitle" class="font-bold text-xs text-slate-700">编辑文章</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="desktopCancelEditBtn" class="hidden md:inline-block px-3 py-1 text-xs text-slate-600 hover:bg-slate-200 rounded-xl transition">取消</button>
                        <button id="saveDocBtn" class="px-4 py-1.5 text-xs font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm transition flex items-center space-x-1">
                            <i class="ri-save-line"></i><span>保存</span>
                        </button>
                    </div>
                </div>

                <!-- 独立滚动的编辑器区域 -->
                <div class="flex-1 overflow-y-auto p-4 md:p-6">
                    <div class="max-w-5xl mx-auto w-full space-y-4">
                        <div>
                            <input type="text" id="editTitleInput" placeholder="输入文章标题..." 
                                class="w-full text-xl font-bold bg-transparent border-b border-slate-200 pb-2 focus:outline-none focus:border-brand-500 text-slate-900 placeholder-slate-400">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">分类</label>
                                <input type="text" id="editCategoryInput" placeholder="例如：产品知识、FAQ..." 
                                    class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">标签（用逗号或空格隔开）</label>
                                <input type="text" id="editTagsInput" placeholder="例如：甜虾 售后 质量说明" 
                                    class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800">
                            </div>
                        </div>

                        <div class="flex flex-col h-[400px] md:h-[500px] border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50">
                            <div class="bg-slate-100 px-4 py-2.5 border-b border-slate-200 flex items-center justify-between text-xs text-slate-500 flex-shrink-0">
                                <span class="font-medium truncate mr-2" id="uploadStatusTip">Markdown 源码（支持粘贴截图）</span>
                                <label class="cursor-pointer text-brand-600 hover:underline flex items-center space-x-1 flex-shrink-0">
                                    <i class="ri-image-add-line"></i><span>上传图片</span>
                                    <input type="file" id="imageUploadInput" accept="image/*" class="hidden">
                                </label>
                            </div>
                            <textarea id="editContentInput" placeholder="使用 Markdown 语法编写内容..." 
                                class="flex-1 w-full p-4 bg-transparent font-mono text-sm resize-none focus:outline-none text-slate-800 placeholder-slate-400"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- GitHub Setup Modal -->
    <div id="githubModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="ri-github-fill text-2xl text-slate-800"></i>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">仓库路径 (Owner/Repo)</label>
                    <input type="text" id="ghRepoInput" value="XiandeShen/Xiande-kb" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">

                    <label class="block text-xs font-medium text-slate-600 mb-1">JSON 数据文件名</label>
                    <input type="text" id="ghPathInput" value="kb_docs.json" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-brand-500">

    </div>

    <!-- Application Script -->
    <script>
        const DEFAULT_DOCS = [
            {
                id: 'doc-1',
                title: '黑头形成的原因',
                category: '北极甜虾产品知识',
                tags: ['甜虾', '黑头', '质量说明'],
                content: '### 什么是“黑头”？\n野生北极甜虾捕捞于深海，头部的黑头现象主要是由于**虾胃部食物（海藻）**未完全消化导致的自然现象，并非腐败变质。',
                updatedAt: '2026/11/7 12:00:00'
            }
        ];

        let docs = [];
        let currentDocId = null;
        let activeCategory = 'ALL';
        let activeTag = null;
        let isEditing = false;
        let githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' };
        
        const imageJsonCache = {};

        window.onload = function() {
            loadGithubConfig();

            if (!githubConfig.token) {
                document.getElementById('authOverlay').classList.remove('hidden');
            }

            loadLocalDocs();
            renderCategoryList();
            renderTagList();
            renderDocList();
            setupEventListeners();
            setupImageHandling();

            if (githubConfig.token && githubConfig.repo) {
                pullFromGithub();
            }
        };

        document.getElementById('authSubmitBtn').onclick = () => {
            const token = document.getElementById('authTokInput').value.trim();
            const repo = document.getElementById('authRepoInput').value.trim() || 'XiandeShen/xiande-kb';
            if (!token) {
                alert('请输入有效的 GitHub Token！');
                return;
            }
            githubConfig.token = token;
            githubConfig.repo = repo;
            githubConfig.path = 'kb_docs.json';
            localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
            
            document.getElementById('authOverlay').classList.add('hidden');
            pullFromGithub();
        };

        document.getElementById('logoutBtn').onclick = () => {
            if (confirm('确定要解除 GitHub 绑定并退出吗？')) {
                localStorage.removeItem('kb_gh_config');
                githubConfig = { token: '', repo: 'XiandeShen/Xiande-kb', path: 'kb_docs.json', sha: '' };
                document.getElementById('authTokInput').value = '';
                document.getElementById('authOverlay').classList.remove('hidden');
            }
        };

        function loadLocalDocs() {
            const saved = localStorage.getItem('kb_docs');
            docs = saved ? JSON.parse(saved) : DEFAULT_DOCS;
        }

        function saveLocalDocs() {
            localStorage.setItem('kb_docs', JSON.stringify(docs));
            renderCategoryList();
            renderTagList();
            renderDocList();
        }

        function renderCategoryList() {
            const categories = {};
            docs.forEach(d => categories[d.category] = (categories[d.category] || 0) + 1);

            document.getElementById('allCount').textContent = docs.length;
            
            const allNavBtn = document.getElementById('allDocsNavBtn');
            if (activeCategory === 'ALL' && !activeTag) {
                allNavBtn.className = 'nav-filter-btn active w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium bg-brand-50 text-brand-600';
            } else {
                allNavBtn.className = 'nav-filter-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100 transition';
            }

            const catListEl = document.getElementById('categoryList');
            catListEl.innerHTML = '';

            Object.entries(categories).forEach(([cat, count]) => {
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center justify-between px-3.5 py-2 rounded-xl text-xs font-medium transition ${activeCategory === cat && !activeTag ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-100'}`;
                btn.innerHTML = `<span class="truncate">${cat}</span><span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100">${count}</span>`;
                btn.onclick = () => {
                    activeCategory = cat;
                    activeTag = null;
                    renderCategoryList();
                    renderDocList();
                    closeMobileSidebar();
                };
                catListEl.appendChild(btn);
            });
        }

        function renderTagList() {
            const tags = new Set();
            docs.forEach(d => (d.tags || []).forEach(t => tags.add(t)));
            const tagListEl = document.getElementById('tagList');
            tagListEl.innerHTML = '';

            tags.forEach(t => {
                const badge = document.createElement('span');
                badge.className = `px-2.5 py-1 text-xs rounded-lg cursor-pointer transition ${activeTag === t ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                badge.textContent = `# ${t}`;
                badge.onclick = () => {
                    activeTag = activeTag === t ? null : t;
                    renderCategoryList();
                    renderTagList();
                    renderDocList();
                    closeMobileSidebar();
                };
                tagListEl.appendChild(badge);
            });
        }

        function renderDocList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = docs.filter(d => {
                const matchSearch = d.title.toLowerCase().includes(query) || d.content.toLowerCase().includes(query) || (d.tags && d.tags.some(t => t.toLowerCase().includes(query)));
                const matchCat = activeCategory === 'ALL' || d.category === activeCategory;
                const matchTag = !activeTag || (d.tags && d.tags.includes(activeTag));
                return matchSearch && matchCat && matchTag;
            });

            const listTitleEl = document.getElementById('listTitle');
            if (query) {
                listTitleEl.textContent = `搜索: "${query}"`;
            } else if (activeTag) {
                listTitleEl.textContent = `# ${activeTag}`;
            } else if (activeCategory !== 'ALL') {
                listTitleEl.textContent = activeCategory;
            } else {
                listTitleEl.textContent = '所有条目';
            }

            document.getElementById('docCountText').textContent = `${filtered.length} 个文档`;
            const docListEl = document.getElementById('docList');
            docListEl.innerHTML = '';

            filtered.forEach(d => {
                const item = document.createElement('div');
                const isSelected = currentDocId === d.id;
                item.className = `relative p-4 cursor-pointer hover:bg-slate-100 transition ${isSelected ? 'bg-brand-50/70' : ''}`;
                
                let html = '';
                if (isSelected) {
                    html += `<div class="absolute left-0 inset-y-0 w-1 bg-brand-600 rounded-r"></div>`;
                }
                html += `
                    <h4 class="font-bold text-xs text-slate-800 truncate">${d.title || '无标题'}</h4>
                    <p class="text-[11px] text-slate-500 line-clamp-2 mt-1">${d.content.replace(/[#*`!]/g, '')}</p>
                    <div class="flex items-center justify-between text-[10px] text-slate-400 mt-2">
                        <span class="px-1.5 py-0.5 rounded bg-slate-100">${d.category}</span>
                        <span>${d.updatedAt ? d.updatedAt.split(' ')[0] : ''}</span>
                    </div>
                `;
                item.innerHTML = html;
                item.onclick = () => openDocView(d.id);
                docListEl.appendChild(item);
            });
        }

        async function openDocView(id) {
            currentDocId = id;
            isEditing = false;
            const doc = docs.find(d => d.id === id);
            if (!doc) return;

            // 切换文档时将正文滚动条归零，确保新文档从头开始显示
            const viewScrollEl = document.querySelector('#viewPanel .overflow-y-auto');
            if (viewScrollEl) {
                viewScrollEl.scrollTop = 0;
            }

            // 显示全局预加载提示
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('hidden');

            // 解析 Markdown 内容
            const parsedHtml = marked.parse(doc.content || '');
            
            // 提取所有图片路径
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = parsedHtml;
            const imgTags = tempDiv.querySelectorAll('img');
            const imagePromises = [];

            // 预先并发拉取所有 JSON 图片
            imgTags.forEach(img => {
                const src = img.getAttribute('src');
                if (src && src.startsWith('images/') && src.endsWith('.json')) {
                    const p = new Promise(async (resolve) => {
                        if (imageJsonCache[src]) {
                            img.src = imageJsonCache[src];
                            resolve();
                            return;
                        }
                        try {
                            const base64Data = await fetchImageJsonFromGithub(src);
                            if (base64Data) {
                                imageJsonCache[src] = base64Data;
                                img.src = base64Data;
                                await new Promise((resImg) => {
                                    const testImg = new Image();
                                    testImg.onload = resImg;
                                    testImg.onerror = resImg;
                                    testImg.src = base64Data;
                                });
                            }
                        } catch (e) {}
                        resolve();
                    });
                    imagePromises.push(p);
                }
            });

            // 等待所有图片在后台加载完成
            await Promise.all(imagePromises);

            // 隐藏加载提示
            loadingOverlay.classList.add('hidden');

            const mainPanel = document.getElementById('mainPanel');
            mainPanel.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editPanel').classList.add('hidden');
            document.getElementById('viewPanel').classList.remove('hidden');

            document.getElementById('viewTitle').textContent = doc.title;
            document.getElementById('viewCategoryBadge').textContent = doc.category;
            document.getElementById('viewDate').innerHTML = `<i class="ri-time-line mr-1"></i>修改于: ${doc.updatedAt || '未知'}`;
            
            document.getElementById('viewContent').innerHTML = tempDiv.innerHTML;

            const tagsContainer = document.getElementById('viewTags');
            tagsContainer.innerHTML = '';
            (doc.tags || []).forEach(t => {
                const tagEl = document.createElement('span');
                tagEl.className = 'px-2.5 py-0.5 rounded-lg text-xs bg-slate-100 text-slate-500';
                tagEl.textContent = `# ${t}`;
                tagsContainer.appendChild(tagEl);
            });

            renderDocList();
        }

        async function fetchImageJsonFromGithub(path) {
            if (!githubConfig.token || !githubConfig.repo) return null;
            const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${path}`, {
                headers: { 'Authorization': `token ${githubConfig.token}` }
            });
            if (res.ok) {
                const fileData = await res.json();
                const jsonStr = decodeURIComponent(escape(atob(fileData.content)));
                const obj = JSON.parse(jsonStr);
                return obj.data;
            }
            return null;
        }

        function setupImageHandling() {
            const textarea = document.getElementById('editContentInput');
            const fileInput = document.getElementById('imageUploadInput');

            textarea.addEventListener('paste', function(e) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let item of items) {
                    if (item.type.indexOf('image') === 0) {
                        e.preventDefault();
                        uploadImageAsJson(item.getAsFile());
                    }
                }
            });

            fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    uploadImageAsJson(e.target.files[0]);
                }
            });
        }

        async function uploadImageAsJson(file) {
            if (!githubConfig.token || !githubConfig.repo) {
                alert('请先绑定 GitHub Token！');
                return;
            }

            const tipEl = document.getElementById('uploadStatusTip');
            tipEl.textContent = '正在压缩图片并打包为独立 JSON 上传...';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxWidth = 1200;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64DataUrl = canvas.toDataURL('image/webp', 0.7);
                    const payload = { data: base64DataUrl };
                    const jsonString = JSON.stringify(payload);
                    const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));
                    const filename = `images/img_${Date.now()}.json`;

                    try {
                        const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${filename}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${githubConfig.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `kb: upload image json ${filename}`,
                                content: contentEncoded
                            })
                        });

                        if (res.ok) {
                            insertAtCursor(document.getElementById('editContentInput'), `\n![图片](${filename})\n`);
                            tipEl.textContent = 'Markdown 源码（独立 JSON 图片上传成功！）';
                        } else {
                            alert('图片上传 GitHub 失败。');
                            tipEl.textContent = 'Markdown 源码（上传失败）';
                        }
                    } catch (err) {
                        alert('网络异常，图片上传失败');
                        tipEl.textContent = 'Markdown 源码（上传异常）';
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function deleteGithubImageJsonsInContent(content) {
            if (!githubConfig.token || !githubConfig.repo || !content) return;
            
            const regex = /images\/img_\d+\.json/g;
            const matches = content.match(regex);
            if (!matches) return;

            for (let jsonPath of matches) {
                try {
                    const getRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${jsonPath}`, {
                        headers: { 'Authorization': `token ${githubConfig.token}` }
                    });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${jsonPath}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `token ${githubConfig.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `kb: delete unused image json ${jsonPath}`,
                                sha: fileData.sha
                            })
                        });
                    }
                } catch (e) {
                    console.warn('清理云端图片 JSON 跳过:', jsonPath);
                }
            }
        }

        function insertAtCursor(textarea, text) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + text.length;
        }

        function closeMobileSidebar() {
            if (window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
        }

        function setupEventListeners() {
            document.getElementById('searchInput').oninput = renderDocList;

            document.getElementById('allDocsNavBtn').onclick = () => {
                activeCategory = 'ALL';
                activeTag = null;
                renderCategoryList();
                renderDocList();
                closeMobileSidebar();
            };

            document.getElementById('newDocBtn').onclick = () => {
                currentDocId = null;
                isEditing = true;
                const mainPanel = document.getElementById('mainPanel');
                mainPanel.classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('viewPanel').classList.add('hidden');
                document.getElementById('editPanel').classList.remove('hidden');

                document.getElementById('editorModeTitle').textContent = '新建知识条目';
                document.getElementById('editTitleInput').value = '';
                document.getElementById('editCategoryInput').value = activeCategory !== 'ALL' ? activeCategory : '通用';
                document.getElementById('editTagsInput').value = '';
                document.getElementById('editContentInput').value = '';
                closeMobileSidebar();
            };

            document.getElementById('editDocBtn').onclick = () => {
                const doc = docs.find(d => d.id === currentDocId);
                if (!doc) return;
                isEditing = true;
                document.getElementById('viewPanel').classList.add('hidden');
                document.getElementById('editPanel').classList.remove('hidden');

                document.getElementById('editorModeTitle').textContent = '编辑文章';
                document.getElementById('editTitleInput').value = doc.title;
                document.getElementById('editCategoryInput').value = doc.category;
                document.getElementById('editTagsInput').value = (doc.tags || []).join(' ');
                document.getElementById('editContentInput').value = doc.content;
            };

            const handleCancelEdit = () => {
                if (currentDocId) {
                    openDocView(currentDocId);
                } else {
                    document.getElementById('editPanel').classList.add('hidden');
                    if (window.innerWidth < 768) {
                        document.getElementById('mainPanel').classList.add('hidden');
                    } else {
                        document.getElementById('emptyState').classList.remove('hidden');
                    }
                }
            };
            document.getElementById('cancelEditBtn').onclick = handleCancelEdit;
            document.getElementById('desktopCancelEditBtn').onclick = handleCancelEdit;

            document.getElementById('backToListBtn').onclick = () => {
                document.getElementById('mainPanel').classList.add('hidden');
                currentDocId = null;
                renderDocList();
            };

            document.getElementById('saveDocBtn').onclick = () => {
                const title = document.getElementById('editTitleInput').value.trim() || '未命名文章';
                const category = document.getElementById('editCategoryInput').value.trim() || '通用';
                const tagsStr = document.getElementById('editTagsInput').value.trim();
                const tags = tagsStr ? tagsStr.split(/[,，\s]+/) : [];
                const content = document.getElementById('editContentInput').value;
                const now = new Date().toLocaleString();

                if (currentDocId) {
                    const doc = docs.find(d => d.id === currentDocId);
                    if (doc) {
                        doc.title = title;
                        doc.category = category;
                        doc.tags = tags;
                        doc.content = content;
                        doc.updatedAt = now;
                    }
                } else {
                    const newDoc = {
                        id: 'doc-' + Date.now(),
                        title, category, tags, content, updatedAt: now
                    };
                    docs.unshift(newDoc);
                    currentDocId = newDoc.id;
                }

                saveLocalDocs();
                openDocView(currentDocId);
                syncToGithub();
            };

            document.getElementById('deleteDocBtn').onclick = async () => {
                if (!confirm('确定要删除这篇知识条目吗？关联的独立图片 JSON 会同步从 GitHub 中清理。')) return;
                
                const docToDelete = docs.find(d => d.id === currentDocId);
                if (docToDelete && docToDelete.content) {
                    await deleteGithubImageJsonsInContent(docToDelete.content);
                }

                docs = docs.filter(d => d.id !== currentDocId);
                currentDocId = null;
                saveLocalDocs();
                document.getElementById('viewPanel').classList.add('hidden');
                if (window.innerWidth < 768) {
                    document.getElementById('mainPanel').classList.add('hidden');
                } else {
                    document.getElementById('emptyState').classList.remove('hidden');
                }
                syncToGithub();
            };

            document.getElementById('githubConfigBtn').onclick = () => {
                document.getElementById('ghTokenInput').value = githubConfig.token;
                document.getElementById('ghRepoInput').value = githubConfig.repo || 'XiandeShen/Xiande-kb';
                document.getElementById('ghPathInput').value = githubConfig.path || 'kb_docs.json';
                document.getElementById('githubModal').classList.remove('hidden');
            };

            document.getElementById('closeModalBtn').onclick = () => {
                document.getElementById('githubModal').classList.add('hidden');
            };

            document.getElementById('saveGithubConfigBtn').onclick = () => {
                githubConfig.token = document.getElementById('ghTokenInput').value.trim();
                githubConfig.repo = document.getElementById('ghRepoInput').value.trim() || 'XiandeShen/Xiande-kb';
                githubConfig.path = document.getElementById('ghPathInput').value.trim() || 'kb_docs.json';
                localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
                document.getElementById('githubModal').classList.add('hidden');
                pullFromGithub();
            };

            document.getElementById('manualSyncBtn').onclick = pullFromGithub;

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            document.getElementById('mobileMenuBtn').onclick = () => {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            };
            overlay.onclick = () => {
                closeMobileSidebar();
            };
        }

        function loadGithubConfig() {
            const saved = localStorage.getItem('kb_gh_config');
            if (saved) {
                githubConfig = JSON.parse(saved);
                if (!githubConfig.repo) githubConfig.repo = 'XiandeShen/Xiande-kb';
            }
        }

        function updateSyncStatus(type, msg) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            if (!dot || !text) return;
            if (type === 'success') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0';
                text.textContent = msg || '已同步';
            } else if (type === 'loading') {
                dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse flex-shrink-0';
                text.textContent = msg || '同步中';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
                text.textContent = msg || '同步失败';
            }
        }

        async function pullFromGithub() {
            if (!githubConfig.token || !githubConfig.repo) return;
            updateSyncStatus('loading', '同步中');

            try {
                const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.path}`, {
                    headers: { 'Authorization': `token ${githubConfig.token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    githubConfig.sha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    docs = JSON.parse(content);
                    saveLocalDocs();
                    updateSyncStatus('success', '已同步');
                } else if (res.status === 404) {
                    await syncToGithub();
                } else {
                    updateSyncStatus('error', '凭证错误');
                }
            } catch (e) {
                updateSyncStatus('error', '网络异常');
            }
        }

        async function syncToGithub() {
            if (!githubConfig.token || !githubConfig.repo) return;
            updateSyncStatus('loading', '同步中');

            try {
                if (!githubConfig.sha) {
                    try {
                        const checkRes = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.path}`, {
                            headers: { 'Authorization': `token ${githubConfig.token}` }
                        });
                        if (checkRes.ok) {
                            const checkData = await checkRes.json();
                            githubConfig.sha = checkData.sha;
                        }
                    } catch (ex) {}
                }

                const jsonStr = JSON.stringify(docs, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonStr)));

                const body = {
                    message: `kb: update docs ${new Date().toLocaleString()}`,
                    content: contentEncoded
                };
                if (githubConfig.sha) body.sha = githubConfig.sha;

                const res = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    const data = await res.json();
                    githubConfig.sha = data.content.sha;
                    localStorage.setItem('kb_gh_config', JSON.stringify(githubConfig));
                    updateSyncStatus('success', '已同步');
                } else {
                    const errJson = await res.json().catch(() => ({}));
                    if (res.status === 409 && githubConfig.sha) {
                        githubConfig.sha = '';
                        return syncToGithub();
                    }
                    updateSyncStatus('error', errJson.message || '推送失败');
                }
            } catch (e) {
                updateSyncStatus('error', '推送失败');
            }
        }
    </script>
</body>
</html>
